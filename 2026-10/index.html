еняет угол зрения.\n\nПереступая этот порог, ты не найдёшь готовых ответов, но здесь всегда есть вопрос. Здесь открываются твои миры и продолжается Путь к Себе.","scheduleWord":"Расписание","ask":"Задать вопрос","footer":"© 13 MIRRORS. Все материалы являются частью авторской разработки 13 MIRRORS.\n\nИспользование и воспроизведение — только с указанием авторства и по согласованию с автором.","accent":"#ecd3a3","font":"Cormorant Garamond"},"eventsLink":true,"grimoire":{"image":"media/78e68a6dad05d8357e02.webp","eyebrow":"Гримуар","title":"Калейдоскоп твоих миров","lead":"Книга пишется.","text":"Здесь рождается Книга, в которой живут миры людей. Каждый, кто прошёл свой путь в 13 MIRRORS, сможет оставить в ней свой след — историю, стихи, рисунки.\n\nМир Тринадцати Зеркал один — большой и живой. Но без человека он отражает пустоту. Поэтому когда Ты оставляешь свои следы Калейдоскоп вплетает их в большой узор.","note":"Здесь появится твой мир.","open":true,"onHome":true,"homeLink":"Гримуар · Калейдоскоп Твоих Миров"}},"routes":{"routes":[{"id":"white-worldbridger","title":"Белый Соединитель Миров","dates":{"from":"2026-10-31","to":"2026-11-12"},"description":"13 дней перехода: бережно завершить, отпустить уходящее и открыть место новому.","image":null,"routeUrl":""},{"id":"red-skywalker","title":"Красный Небесный Странник","dates":{"from":"2026-10-18","to":"2026-10-30"},"description":"13 дней пути за пределы привычного — туда, где открываются новые горизонты.","image":null,"routeUrl":""},{"id":"yellow-sun","title":"Жёлтое Солнце","dates":{"from":"2026-10-05","to":"2026-10-17"},"description":"13 дней о ясности, жизненной силе и о том, куда ты направляешь свой свет.","image":"media/ab50ba94293e2a22ba6d.webp","routeUrl":"","glass":{}},{"id":"blue-hand","title":"Синяя Рука","dates":{"from":"2026-09-22","to":"2026-10-04"},"description":"13 дней о действии, опыте и завершении начатого. Волна началась в сентябре, а в октябре мы проходим её последние дни.","image":"media/2bf9bfde7fb5689060a6.webp","routeUrl":"https://elenarasprugina.github.io/13mirrors-blue-hand/","glass":{}},{"id":"white-wizard","title":"Белый Волшебник","dates":{"from":"2026-09-09","to":"2026-09-21"},"kin":{"value":"Kin 14 · Магнитный тон · Белый Волшебник","show":true},"description":"Игровой 13-дневный маршрут возвращения к детскому способу встречаться с миром — через притяжение, любопытство, игру, воображение и непосредственный опыт. Первый день начинался с простого исследования: заметить то, что притягивает без объяснимой причины, и позволить этому стать входом в маршрут.","image":"media/ce901059109a44cf25f5.webp","routeUrl":""},{"id":"red-dragon","title":"Красный Дракон","dates":{"from":"2026-08-27","to":"2026-09-08"},"kin":{"value":"Kin 1 · Красный Магнитный Дракон · тон 1 — Магнитный","show":true},"description":"13 дней контакта с тем, что ещё только начинает проявляться. Здесь не нужно заранее понимать, куда всё ведёт: задача маршрута — замечать отдельные признаки нового, сохранять их и не торопить складываться в готовую историю. Это путь про приближение, различение и первые просветы в том, что пока ещё не стало очевидным.","image":"media/1199c536752f87460e04.webp","routeUrl":""},{"id":"route-q5dqb","title":"Жёлтая Звезда","dates":{"from":"2026-08-14","to":"2026-08-26"},"kin":{"value":"Kin 248 · Магнитный тон · Жёлтая Звезда","show":true},"description":"Маршрут об отношениях мужчины и женщины. В течение 13 дней одна реальная история рассматривалась с разных сторон: близость и расстояние, любовь и ожидания, свобода и выбор, другой человек рядом и собственное место в отношениях. Гармония здесь — не «чтобы всё стало хорошо», а возможность увидеть больше частей общего рисунка","image":"media/19403301a31215928038.webp","routeUrl":"","archive":false,"archiveBlocks":[{"id":"sb-uzzel","kind":"text","visible":true,"title":"Как это было","text":"","collapse":true},{"id":"sb-jo4ez","kind":"images","visible":true,"images":[]}],"archiveActions":[]},{"id":"route-w083k","title":"Синий Орёл","dates":{"from":"2026-08-01","to":"2026-08-13"},"kin":{"value":"Kin 235 · Магнитный тон · Синий Орёл","show":true},"description":"Маршрут про высоту взгляда: увидеть ситуацию шире, заметить связи между отдельными событиями и обнаружить возможности, которые не видны из привычной точки наблюдения. Не уйти от жизни «на высоту», а попробовать изменить перспективу и посмотреть, какой рисунок проявится.","image":"media/27c0ca6597c1098c891e.webp","routeUrl":""},{"id":"route-ycvqx","title":"Белый Ветер","dates":{"from":"2026-07-19","to":"2026-07-31"},"kin":{"value":"Kin 222 · Магнитный тон · Белый Ветер","show":true},"description":"Первый маршрут, в который вошли участники со своими личными запросами. Эти 13 дней были про слушание: что на самом деле говорит запрос, какой собственный голос звучит за привычными объяснениями и что становится слышно в паузах, словах, дыхании, теле и событиях.","image":"media/3bc33ad2997f97d7b2ac.webp","routeUrl":""},{"id":"route-7my46","title":"Сладкоежка","dates":{"from":"2026-07-14","to":"2026-07-22"},"description":"Исследование отношений со сладким без запретов, борьбы и попыток «взять себя в руки». Участники наблюдают, что происходит до момента, когда тянет к сладкому: какие состояния, привычные маршруты, внутренние фигуры и способы справляться с собой за этим стоят. Постепенно сладкое становится не проблемой само по себе, а точкой входа в более внимательное знакомство с собой.","image":"media/9cb5d821afeca85e2b2b.webp","routeUrl":""},{"id":"route-fsu0w","title":"Сладкоежка ~ 2","dates":{"from":"2026-08-31","to":"2026-09-06"},"description":"продолжение исследования отношений со сладким, но уже в формате небольшого расследования. Здесь участники не ищут виноватых и не воюют с привычкой, а наблюдают, какую работу выполняет конкретный продукт в конкретный момент: помогает справиться со стрессом, усталостью, скукой, напряжением или чем-то ещё. Цель маршрута — понять механизм и вернуть себе больше свободы выбора.","image":"media/a921468258af01f64ea1.webp","routeUrl":"","archive":false,"archiveBlocks":[],"archiveActions":[],"glass":{}}]},"formats":{"formats":[{"id":"observe","title":"Наблюдение","price":"Свободный вход"},{"id":"journey","title":"Путешествие","price":"7 000 ₽","note":{"value":"Закрытая группа","show":true}},{"id":"immersion","title":"Погружение","price":"18 000 ₽","note":{"value":"Индивидуальное сопровождение","show":true}}]},"index":{"showcases":[{"id":"2026-10","title":"Октябрь 2026","status":"published"}]},"sandbox":{"eyebrow":"13 MIRRORS · общий раздел","title":"Как устроены маршруты 13 MIRRORS","intro":"Здесь собраны примеры уже пройденных маршрутов: отдельные дни и фрагменты итоговых Летописей участников.","tabs":{"days":"Примеры Маршрутов","chronicles":"Что забираете с собой","reviews":"Ваши отзывы"},"days":[{"id":"d-blue-hand-10","visible":true,"order":1,"routeId":"blue-hand","day":10,"title":"Жёлтый Планетарный Воин","blocks":[{"id":"sb-uu0zs","kind":"text","visible":true,"title":"Главный вопрос","text":"**Какой конкретный шаг я готов сделать сейчас, даже если страх или сомнение ещё остаются?**"},{"id":"sb-shpor","kind":"text","visible":true,"title":"Практика 1","text":"**Шаг на 15 минут**\n\nВыберите действие по своему запросу, которое можно выполнить сегодня максимум за 15 минут.\n\n**Сделайте его до конца.**","collapse":true},{"id":"sb-jqoli","kind":"text","visible":true,"title":"Практика 2","text":"**Реальный шаг**\n\nВыберите действие, после которого в реальности что-то изменится — если это безопасно и уместно.\n\nДо действия запишите:\n- ожидания;\n- опасения.\n\nПосле действия:\n- что произошло фактически.","collapse":true},{"id":"sb-w72u5","kind":"text","visible":true,"title":"След дня","text":"**Где сегодня я увидел реальное действие там, где можно было продолжать ждать, сомневаться или откладывать?**"}],"cover":"media/33775564c97b1749cc77.webp","shareImage":"media/bef8af9ec8f684c3467f.jpg"},{"id":"d-white-wizard-7","visible":true,"order":2,"routeId":"white-wizard","day":7,"tone":{"value":"Резонансный тон","show":true},"title":"Жёлтое Солнце","blocks":[{"id":"sb-rq36x","kind":"text","visible":true,"title":"Контур дня","text":"Свет.\nРезонансный тон — середина пути, точка, в которой можно на мгновение остановиться и почувствовать, что уже произошло.\nСегодняшний день не требует действия. Только паузы.","collapse":true},{"id":"sb-kibfs","kind":"text","visible":true,"title":"Мысль дня","text":"Свету не нужно, чтобы ты что-то с ним делал — только чтобы был рядом.","look":"thought"},{"id":"sb-plfkl","kind":"text","visible":true,"title":"Практика","text":"Побудь в тепле или на свету несколько минут без задачи.\n\nЕсли получится — молча сверься с собой:\n\n**Что уже изменилось за первую половину пути?**\n\nНе анализируй. Достаточно одного ощущения.","collapse":true},{"id":"sb-nrdwy","kind":"text","visible":true,"title":"След дня","text":"**Что было в этой паузе — коротко, без объяснения, зачем это было?**"}],"cover":"media/fc02ad728ab05b4c6490.webp","shareImage":"media/577a5210bee5ad7c9285.jpg"},{"id":"d-red-dragon-1","visible":true,"order":3,"routeId":"red-dragon","day":1,"title":"Красный Магнитный Дракон","blocks":[{"id":"sb-m2jml","kind":"text","visible":true,"title":"Контур дня","text":"В начале ещё невозможно увидеть всю картину.\nИз большого неопределённого пространства отдельные вещи лишь начинают выходить в фокус: мысль, образ, человек, фраза, ощущение, желание, событие.\n\nСегодня не нужно решать, что из этого важно и куда оно ведёт. Достаточно заметить то, что само становится различимым.","collapse":true},{"id":"sb-iodz4","kind":"text","visible":true,"title":"Мысль дня","text":"Ещё рано знать. Всему своё время.","look":"thought"},{"id":"sb-tsfsq","kind":"text","visible":true,"title":"Практика","text":"**Собери диафильм своего дня.**\n\nНесколько раз в течение дня остановись на мгновение и запечатлей один кадр:\n\n**Что сейчас оказалось в фокусе моего внимания?**\n\nСохрани несколько таких кадров — словом, фотографией, короткой записью, образом.\n\nНе ищи между ними связи. Не пытайся понять, почему именно они. Сегодня достаточно их увидеть.","collapse":true},{"id":"sb-u0e2i","kind":"text","visible":true,"title":"След дня","text":"**Что сегодня само оказалось в фокусе моего внимания?**"}],"cover":"media/a8a178b0984740eec714.webp","shareImage":"media/d2583632ffd230b044fa.jpg"},{"id":"d-03gd9","visible":true,"routeId":"route-7my46","day":null,"title":"Итоги","order":4,"blocks":[{"id":"sb-6s0te","kind":"text","visible":true,"title":"Контур дня","text":"Станция 2 · Следы\nСладкое часто оказывается не началом истории, а её последней остановкой. Всё самое интересное происходит немного раньше.\n","collapse":true},{"id":"sb-liwhd","kind":"text","visible":true,"title":"Мысль дня","text":"🌿 Мантра дня\n\nСегодня я исследую привычный маршрут.","look":"thought"},{"id":"sb-w8qhf","kind":"text","visible":true,"title":"Практика","text":"🎯 ПРАКТИКА ДНЯ:\n\nПредставьте, что вы поднимаетесь на воздушном шаре высоко над своим днём.\n\nТам, с высоты не видно мелких деталей, но можно увидеть весь маршрут.\n\nПопробуйте мысленно посмотреть на свой день сверху.\n\nГде начинается тропинка, которая привела вас к сладкому? Какие остановки она проходит? Какие места повторяются чаще всего?\n\nНе пытайтесь вспоминать, поробуйте увидеть, наблюдайте.\n\nУ высоты совсем другой обзор, правда?\n\nВ течение дня мысленно говорите себе:\n\n- Набираю высоту.\n\nИ представляете, как поднимаетесь на воздушном шаре, рассматривая свой день с высоты.","collapse":true},{"id":"sb-9n62g","kind":"text","visible":true,"title":"След дня","text":"✏️ ЗАМЕТКИ НА ПОЛЯХ:\n\nСегодня я...\n——————\n\n• Посмотрел(а) на свой день с высоты\n• Нашёл(ла) повторяющиеся остановки на маршруте\n• Прошёл(ла) путь в обратном направлении\n• Записал(а) свои наблюдения"}],"cover":"media/89d3a6a5da24c36da7ee.webp","shareImage":"media/59931c3d831cfa7557b5.jpg"},{"id":"d-3bp34","visible":true,"routeId":"route-q5dqb","day":null,"title":"День 1","blocks":[{"id":"sb-1g3za","kind":"text","visible":true,"title":"Контур дня","text":"Отражение - 1\nПредставьте...\nКак огромное облако газа и пыли становится пространством возможного. \nВ хаотическом веществе ещё нельзя разглядеть будущую форму, но где-то внутри него возникают условия, при которых одна из бесчисленных возможностей получает шанс стать событием.\n\nЕщё ничего не произошло. Нет формы, нет ответа, нет понимания направления движения. \n\nНо уже есть точка начала, в которой среди огромного количества возможного именно это может обрести реальность.\n\nВ поле неизвестного появляется область будущего события.","collapse":true},{"id":"sb-des49","kind":"text","visible":true,"title":"Главный вопрос","text":"Как сегодня звучит самый важный вопрос к самому себе?","collapse":true}],"order":5,"cover":"media/8392362a0783ab1c601e.webp","shareImage":"media/e9ccec80fa36d4f571b5.jpg"},{"id":"d-zpdr9","visible":true,"routeId":"route-fsu0w","day":null,"title":"День 1","blocks":[{"id":"sb-f6evy","kind":"text","visible":true,"title":"Контур дня","text":"Итак, Маршрут начинается.\n\nЕсть Город - моя повседневная жизнь. Она наполнена смыслами и автоматизмами.\n\nИ на первый взгляд, каждый сладкий герой - добропорядочный гражданин.","collapse":true},{"id":"sb-sr69o","kind":"text","visible":true,"title":"🔴 Вопросы для поиска улик.","text":"⁉️Что сегодня из сладкого  было на вашем столе?\nА во рту? 🎂\n\n⁉️Что именно цепляет вас в этой еде? Вкус? Запах? Текстура? Послевкусие?\n\n⁉️ Чем можно заменить вашу прелесть? 🍡"}],"order":6,"cover":"media/f961aa3d7fa1990e9bd9.webp","shareImage":"media/1e3e4bf867dbe530cdc5.jpg"}],"chronicles":[{"id":"c-white-wizard-1","visible":true,"order":1,"routeId":"white-wizard","name":"Летопись · пример 1","blocks":[{"id":"sb-ptxz2","kind":"text","visible":true,"title":"Фрагмент Летописи","text":"Маршрут не ответил за тебя, нужно ли покупать швейную машину.\n\nИ, возможно, сейчас важнее другое.\n\nОн сделал видимым один участок пути.\n\nТы заметил момент, когда захотелось быстрого результата. И в этот раз не остановился на нём.\n\nТы вернул внимание к процессу. И завершил начатое.\n\nВозможно, одна из важных дорожек сейчас проходит здесь:\n- не требовать от будущего гарантии до начала пути;\n- позволять образу постепенно становиться формой;\n- не оставлять тело за пределами этого процесса;\n- давать созданному достаточно времени, прежде чем решать, чему из этого жить дальше.","collapse":true}],"shareImage":"media/1109e12fa5a22263d369.jpg"},{"id":"c-white-wizard-2","visible":true,"order":2,"routeId":"white-wizard","name":"Летопись · пример 2","blocks":[{"id":"sb-4auus","kind":"text","visible":true,"title":"Фрагмент Летописи","text":"Маршрут не объясняет, почему в твоей жизни начался период трансформирующих событий и что именно изменится дальше.\n\nНо в оставленных тобой Следах он делает видимым один способ движения.\n\nТы замечаешь происходящее довольно рано — ещё до того, как появляется законченная история о нём.\n\nСначала через общее ощущение, затем через всё более конкретные телесные детали. В середине пути ты уже связываешь накопление маленьких шагов с изменением более крупного масштаба, а позднее совершаешь конкретное действие отпускания.\n\nВозможно, одна из важных дорожек здесь проходит через способность слышать ранние сигналы изменения, не требовать от них немедленного объяснения и давать новому достаточно времени, чтобы оно смогло проявить свою форму.","collapse":true}],"shareImage":"media/a02f2f687447a2605cfb.jpg"},{"id":"c-qv86w","visible":true,"routeId":"route-q5dqb","name":"Свидетельство · пример 1","blocks":[{"id":"sb-qzh4j","kind":"text","visible":true,"title":"Фрагмент Свидетельства о завершении маршрута","text":"К финалу маршрута отношения перестали занимать всю картину жизни. Рядом с ними появилась своя дорога: реализация, доход, проявленность, собственные интересы и возможность больше выбирать.\nНа вопрос «Что из прожитого за эти дни ты проносишь с собой дальше?» участница ответила:\n«Те действия-якоря, уверенное спокойствие и устойчивость в теме отношений. Состояние: я в игре».\nВчера было просто «игра». Сегодня — «я в игре».\nИ финальные слова Жёлтой Звезде:\n«Спасибо за твой Свет! Он стал частью меня!»","collapse":true}],"order":3,"shareImage":"media/b4a878d0c8d02ff68666.jpg"}],"reviews":[{"id":"r-01","visible":true,"order":1,"text":"Это был совершенно неожиданный и даже спонтанный опыт такого исследования.\nИ это получилось очень глубоко и очень своевременно.\nМне кажется, я почти накануне начала марафона увидела у тебя в канале про «Маршрут Сладкоежки» и тут же залетела, потому что устала сама от себя и понимала, что мне, человеку, которому совершенно не свойственно «жрать», надо осознать про это что-то важное, чего сама я не понимаю.\nИ я могу сказать, что всё было построено настолько логично и последовательно, что моя психика начала распаковывать мне всё и сразу.\nСамое ценное для меня — это пробуждение «наблюдателя» и возможность смотреть на Нехочуху с благодарностью, задавать этой фигуре вопросы, не отворачиваться от неё и не затыкать рот едой.\nМне хватило абсолютно всего. Сейчас самое важное — удержать навык разговаривать с новой обнаруженной фигурой и не слиться в том, чтобы перестроить реакции.\nХочется чаще фиксировать себя на вопросах: а как делать по-другому? Есть ли варианты? А чего хочется? И научиться не пропускать момент, когда ресурса на возможность задать такой вопрос и остановить себя уже нет…\nСпасибо большое за энергию, за задания и за маршрут.\n","author":"Лилия","routeId":"route-7my46","month":"Июль 2026","source":"Telegram","signature":{"show":true}},{"id":"r-02","visible":true,"order":2,"text":"Лен, здесь, в твоём поле, в работе с тобой получилось не просто заметить, но и осознать, как работает «механизм» с замещением чего-либо посредством употребления в пищу сладкого! Более того — посмотреть шире и обратить внимание на разные свои привычки.\nИ да, не всё получается сразу, но в этом нужна практика и внимание к себе. Немало ещё работы предстоит...) Но благодаря тебе получилось сделать первый и самый важный шаг к осознанию этого и практике!\nЭто очень ценно!","author":"Илья","routeId":"route-7my46","month":"Июль 2026","source":"VK","signature":{"show":true}},{"id":"r-ld6zg","visible":true,"text":"Благодарю тебя за то, что провела меня по этому пути! Чувствовала и ощущала твое присутствие, любящий взгляд, бережную поддержку!\nОбнимаю тебя крыльями и своим новым Светом✨","author":"Ирина","routeId":"route-q5dqb","month":"","source":"Telegram","signature":{"show":true},"order":3}],"signatureText":"Опубликовано с разрешения. Орфография и пунктуация отредактированы, смысл сохранён.","labels":{"day":"День {n}","meaning":"Контур дня","question":"Главный вопрос","practice":"Практика {n}","trace":"След дня","fragment":"Фрагмент Летописи","lens":"Линза 13 MIRRORS","review":"Отзыв","thought":"Мысль дня","practiceOne":"Практика"},"look":{"background":{"color":"#0d0a07","image":"media/e92f338f61f2279f939a.webp","dim":55,"blur":8,"imageTall":"media/4ab75352b39b4748cc9a.webp"},"font":"Cormorant Garamond","textColor":"#ecd4a3","headColor":"#ecd3a3","accent":"#0d0a07","panelBg":"#0d0a07","glass":30,"glassBlur":8,"textSize":"lg","win":{"mode":""},"lineH":"","imgGlass":{"on":true,"mark1":{},"mark2":{},"fit":"even","dates":false,"day":false,"kin":true},"tabs":{"active":"glass","glass":70,"rim":"glow"}},"intros":{"days":"Примеры дней на маршрутах","chronicles":"После завершения маршрута отдельные ответы, наблюдения и Следы можно собрать в персональную **Летопись участника маршрута**.\n\nЭто не пересказ заданий и не готовое объяснение человека.\nЛетопись возвращает участнику его собственный материал и помогает увидеть рисунок, который мог быть незаметен, пока проживались отдельные дни.","reviews":""}},"reflection":{"eyebrow":"Карта-Отражение","title":"Примеры","intro":"Каждая Карта-Отражение — это образ и архетип, собранные вокруг твоего кина. Здесь — несколько примеров. Полный персональный разбор — сильные стороны, тени и вопросы — всё описание собирается после прохождения 1-дневного индивидуального маршрута. \nТвои ответы на вопросы служат основой для сборки уникального архетипа 13 MIRRORS.","orderAction":{"show":true,"kind":"contact","label":"Заказать Карту-Отражение","message":"Здравствуйте! Хочу заказать Карту-Отражение."},"items":[{"id":"e-cfa7a","visible":true,"image":"media/5f34caa11c79fd4db233.webp","title":"Проводник пространств","text":"Чувствует пространство как живую среду и улавливает, где открывается проход в новое. Помогает выйти за пределы привычного, увидеть более широкий горизонт и услышать направление, которое уже откликается изнутри.","order":1,"meta":"Kin 33 · Красный Резонансный Небесный Странник","glass":{}},{"id":"e-kin232","visible":true,"order":2,"image":"media/5225e43ee14183bea96b.webp","meta":"Kin 232 · Жёлтый Спектральный Человек","title":"Носитель Осознанности","text":"Архетип свободной воли и осознанного выбора. Его линия — различать собственное решение среди привычек, страхов и чужих ожиданий и освобождать место для того, что действительно своё.","glass":{}},{"id":"e-kin182","visible":true,"order":3,"image":"media/cc9a372bce175027c49f.webp","meta":"Kin 182 · Белый Космический Ветер","title":"Хранитель Истинного Голоса","text":"Связан с внутренней истиной, словом и способностью слышать невысказанное. Рядом с ним другим бывает легче услышать себя — не из-за готовых ответов, а благодаря качеству присутствия.","glass":{}},{"id":"e-kin226","visible":true,"order":4,"image":"media/2f1253e0958e77e75e05.webp","meta":"Kin 226 · Белый Обертонный Соединитель Миров","title":"Ткачиха Переходов","text":"Создаёт пространство, в котором различное может встретиться, не теряя своей природы. В точках соприкосновения возникает свет, а из множества контактов складывается новый узор и открывается путь.","glass":{}},{"id":"e-kin68","visible":true,"order":5,"image":"media/bd719df5de3eeafb6a99.webp","meta":"Kin 68 · Жёлтая Электрическая Звезда","title":"Камертон Гармонии","text":"Помогает разрозненному становиться созвучным. Чувствует связи между людьми, идеями и событиями и создаёт пространство, в котором различия начинают дополнять друг друга.","glass":{}},{"id":"e-kin108","visible":true,"order":6,"image":"media/3dd700bbc1281d55928c.webp","meta":"Kin 108 · Жёлтая Самосущная Звезда","title":"Сияющий Художник","text":"Видит целостный образ ещё до того, как он стал очевидным, и помогает внутреннему замыслу обрести форму. Его произведением может стать проект, пространство, разговор или сама жизнь.","glass":{}}],"placeholder":"Изображение скоро появится","look":{"background":{"color":"#0d0a07","image":"media/e92f338f61f2279f939a.webp","dim":55,"blur":8,"imageTall":"media/4ab75352b39b4748cc9a.webp"},"font":"Cormorant Garamond","textColor":"","headColor":"#ecd3a3","accent":"#ecd3a3","panelBg":"#0d0a07","glass":25,"glassBlur":8,"textSize":"lg","imgGlass":{"mark1":{},"mark2":{}},"win":{}}},"events":{"eyebrow":"13 MIRRORS","title":"События","intro":"Встречи, медитации, фестивали и поездки 13 MIRRORS.\nНажмите на событие, чтобы узнать подробности.","tabs":{"soon":"Скоро","past":"Как это было","cases":"Примеры практик"},"items":[{"id":"ev-a4g8f","visible":true,"type":"meeting","title":"Город МАК","date":"2026-10-08","dateEnd":"","time":"","duration":120,"place":"Онлайн","price":"свободный вход","cover":"media/ad4ca7d2770fe5ec4071.webp","summary":"","archive":true,"blocks":[{"id":"sb-cz6sj","kind":"text","visible":true,"title":"О встрече","text":"Прогулка по улицам ассоциаций — от вашего текущего состояния к тому, в котором желание уже стало реальностью. Через МАК-карты, вопросы и живой маршрут мы будем искать не ответ «как получить желаемое», а состояние, из которого к нему можно идти.","collapse":true,"look":"normal","order":1},{"id":"sb-rvtle","kind":"images","visible":true,"images":[{"id":"img-pjjx4","src":"media/7468d785c0bcf6827ecb.webp","caption":"","visible":true,"order":1},{"id":"img-0hmn5","src":"media/579acc6dee2591b8ef81.webp","captio
