ает пустоту. Поэтому когда Ты оставляешь свои следы Калейдоскоп вплетает их в большой узор.","note":"Здесь появится твой мир.","open":true,"onHome":true,"homeLink":"Гримуар · Калейдоскоп Твоих Миров"}},"routes":{"routes":[{"id":"white-worldbridger","title":"Белый Соединитель Миров","dates":{"from":"2026-10-31","to":"2026-11-12"},"description":"13 дней перехода: бережно завершить, отпустить уходящее и открыть место новому.","image":null,"routeUrl":""},{"id":"red-skywalker","title":"Красный Небесный Странник","dates":{"from":"2026-10-18","to":"2026-10-30"},"description":"13 дней пути за пределы привычного — туда, где открываются новые горизонты.","image":"media/089c59bee68f0694497e.webp","routeUrl":"","glass":{},"finalWords":1,"finalText1":{"value":"Маршрут пройден","show":true},"finalText2":{"value":"Увидимся за поворотом…","show":true}},{"id":"yellow-sun","title":"Жёлтое Солнце","dates":{"from":"2026-10-05","to":"2026-10-17"},"description":"13 дней о ясности, жизненной силе и о том, куда ты направляешь свой свет.","image":"media/ab50ba94293e2a22ba6d.webp","routeUrl":"","glass":{},"finalWords":1,"finalText1":{"value":"Маршрут пройден","show":true},"finalText2":{"value":"Увидимся за поворотом…","show":true}},{"id":"blue-hand","title":"Синяя Рука","dates":{"from":"2026-09-22","to":"2026-10-04"},"description":"13 дней о действии, опыте и завершении начатого. Волна началась в сентябре, а в октябре мы проходим её последние дни.","image":"media/2bf9bfde7fb5689060a6.webp","routeUrl":"https://elenarasprugina.github.io/13mirrors-blue-hand/","glass":{},"archive":true,"archiveBlocks":[{"id":"sb-79fqq","kind":"text","visible":true,"title":"Как это было","text":"","collapse":true},{"id":"sb-eu114","kind":"images","visible":true,"images":[]}],"archiveActions":[],"finalVideo":"media/7825920db8033f327918.mp4","finalVideoName":"day13_namaste.mp4","filmSeed":1,"finalWords":1,"finalText1":{"value":"Маршрут пройден","show":true},"finalText2":{"value":"Увидимся за поворотом…","show":true},"shareImage":"media/1c9a240455d1b9efcf69.jpg"},{"id":"white-wizard","title":"Белый Волшебник","dates":{"from":"2026-09-09","to":"2026-09-21"},"kin":{"value":"Kin 14 · Магнитный тон · Белый Волшебник","show":true},"description":"Игровой 13-дневный маршрут возвращения к детскому способу встречаться с миром — через притяжение, любопытство, игру, воображение и непосредственный опыт. Первый день начинался с простого исследования: заметить то, что притягивает без объяснимой причины, и позволить этому стать входом в маршрут.","image":"media/ce901059109a44cf25f5.webp","routeUrl":""},{"id":"red-dragon","title":"Красный Дракон","dates":{"from":"2026-08-27","to":"2026-09-08"},"kin":{"value":"Kin 1 · Красный Магнитный Дракон · тон 1 — Магнитный","show":true},"description":"13 дней контакта с тем, что ещё только начинает проявляться. Здесь не нужно заранее понимать, куда всё ведёт: задача маршрута — замечать отдельные признаки нового, сохранять их и не торопить складываться в готовую историю. Это путь про приближение, различение и первые просветы в том, что пока ещё не стало очевидным.","image":"media/1199c536752f87460e04.webp","routeUrl":""},{"id":"route-q5dqb","title":"Жёлтая Звезда","dates":{"from":"2026-08-14","to":"2026-08-26"},"kin":{"value":"Kin 248 · Магнитный тон · Жёлтая Звезда","show":true},"description":"Маршрут об отношениях мужчины и женщины. В течение 13 дней одна реальная история рассматривалась с разных сторон: близость и расстояние, любовь и ожидания, свобода и выбор, другой человек рядом и собственное место в отношениях. Гармония здесь — не «чтобы всё стало хорошо», а возможность увидеть больше частей общего рисунка","image":"media/19403301a31215928038.webp","routeUrl":"","archive":false,"archiveBlocks":[{"id":"sb-uzzel","kind":"text","visible":true,"title":"Как это было","text":"","collapse":true},{"id":"sb-jo4ez","kind":"images","visible":true,"images":[]}],"archiveActions":[]},{"id":"route-w083k","title":"Синий Орёл","dates":{"from":"2026-08-01","to":"2026-08-13"},"kin":{"value":"Kin 235 · Магнитный тон · Синий Орёл","show":true},"description":"Маршрут про высоту взгляда: увидеть ситуацию шире, заметить связи между отдельными событиями и обнаружить возможности, которые не видны из привычной точки наблюдения. Не уйти от жизни «на высоту», а попробовать изменить перспективу и посмотреть, какой рисунок проявится.","image":"media/27c0ca6597c1098c891e.webp","routeUrl":""},{"id":"route-ycvqx","title":"Белый Ветер","dates":{"from":"2026-07-19","to":"2026-07-31"},"kin":{"value":"Kin 222 · Магнитный тон · Белый Ветер","show":true},"description":"Первый маршрут, в который вошли участники со своими личными запросами. Эти 13 дней были про слушание: что на самом деле говорит запрос, какой собственный голос звучит за привычными объяснениями и что становится слышно в паузах, словах, дыхании, теле и событиях.","image":"media/3bc33ad2997f97d7b2ac.webp","routeUrl":""},{"id":"route-7my46","title":"Сладкоежка","dates":{"from":"2026-07-14","to":"2026-07-22"},"description":"Исследование отношений со сладким без запретов, борьбы и попыток «взять себя в руки». Участники наблюдают, что происходит до момента, когда тянет к сладкому: какие состояния, привычные маршруты, внутренние фигуры и способы справляться с собой за этим стоят. Постепенно сладкое становится не проблемой само по себе, а точкой входа в более внимательное знакомство с собой.","image":"media/9cb5d821afeca85e2b2b.webp","routeUrl":""},{"id":"route-fsu0w","title":"Сладкоежка ~ 2","dates":{"from":"2026-08-31","to":"2026-09-06"},"description":"продолжение исследования отношений со сладким, но уже в формате небольшого расследования. Здесь участники не ищут виноватых и не воюют с привычкой, а наблюдают, какую работу выполняет конкретный продукт в конкретный момент: помогает справиться со стрессом, усталостью, скукой, напряжением или чем-то ещё. Цель маршрута — понять механизм и вернуть себе больше свободы выбора.","image":"media/a921468258af01f64ea1.webp","routeUrl":"","archive":false,"archiveBlocks":[],"archiveActions":[],"glass":{}}]},"formats":{"formats":[{"id":"observe","title":"Наблюдение","price":"Свободный вход"},{"id":"journey","title":"Путешествие","price":"7 000 ₽","note":{"value":"Закрытая группа","show":true}},{"id":"immersion","title":"Погружение","price":"18 000 ₽","note":{"value":"Индивидуальное сопровождение","show":true}}]},"index":{"showcases":[{"id":"2026-10","title":"Октябрь 2026","status":"published"}]},"sandbox":{"eyebrow":"13 MIRRORS · общий раздел","title":"Как устроены маршруты 13 MIRRORS","intro":"Здесь собраны примеры уже пройденных маршрутов: отдельные дни и фрагменты итоговых Летописей участников.","tabs":{"days":"Примеры Маршрутов","chronicles":"Что забираете с собой","reviews":"Ваши отзывы"},"days":[{"id":"d-blue-hand-10","visible":true,"order":1,"routeId":"blue-hand","day":10,"title":"Жёлтый Планетарный Воин","blocks":[{"id":"sb-uu0zs","kind":"text","visible":true,"title":"Главный вопрос","text":"**Какой конкретный шаг я готов сделать сейчас, даже если страх или сомнение ещё остаются?**"},{"id":"sb-shpor","kind":"text","visible":true,"title":"Практика 1","text":"**Шаг на 15 минут**\n\nВыберите действие по своему запросу, которое можно выполнить сегодня максимум за 15 минут.\n\n**Сделайте его до конца.**","collapse":true},{"id":"sb-jqoli","kind":"text","visible":true,"title":"Практика 2","text":"**Реальный шаг**\n\nВыберите действие, после которого в реальности что-то изменится — если это безопасно и уместно.\n\nДо действия запишите:\n- ожидания;\n- опасения.\n\nПосле действия:\n- что произошло фактически.","collapse":true},{"id":"sb-w72u5","kind":"text","visible":true,"title":"След дня","text":"**Где сегодня я увидел реальное действие там, где можно было продолжать ждать, сомневаться или откладывать?**"}],"cover":"media/33775564c97b1749cc77.webp","shareImage":"media/20d76d3c9e4f1d8ba73a.jpg"},{"id":"d-white-wizard-7","visible":true,"order":2,"routeId":"white-wizard","day":7,"tone":{"value":"Резонансный тон","show":true},"title":"Жёлтое Солнце","blocks":[{"id":"sb-rq36x","kind":"text","visible":true,"title":"Контур дня","text":"Свет.\nРезонансный тон — середина пути, точка, в которой можно на мгновение остановиться и почувствовать, что уже произошло.\nСегодняшний день не требует действия. Только паузы.","collapse":true},{"id":"sb-kibfs","kind":"text","visible":true,"title":"Мысль дня","text":"Свету не нужно, чтобы ты что-то с ним делал — только чтобы был рядом.","look":"thought"},{"id":"sb-plfkl","kind":"text","visible":true,"title":"Практика","text":"Побудь в тепле или на свету несколько минут без задачи.\n\nЕсли получится — молча сверься с собой:\n\n**Что уже изменилось за первую половину пути?**\n\nНе анализируй. Достаточно одного ощущения.","collapse":true},{"id":"sb-nrdwy","kind":"text","visible":true,"title":"След дня","text":"**Что было в этой паузе — коротко, без объяснения, зачем это было?**"}],"cover":"media/fc02ad728ab05b4c6490.webp","shareImage":"media/862ffcfa3f1c9bbf6b1e.jpg"},{"id":"d-red-dragon-1","visible":true,"order":3,"routeId":"red-dragon","day":1,"title":"Красный Магнитный Дракон","blocks":[{"id":"sb-m2jml","kind":"text","visible":true,"title":"Контур дня","text":"В начале ещё невозможно увидеть всю картину.\nИз большого неопределённого пространства отдельные вещи лишь начинают выходить в фокус: мысль, образ, человек, фраза, ощущение, желание, событие.\n\nСегодня не нужно решать, что из этого важно и куда оно ведёт. Достаточно заметить то, что само становится различимым.","collapse":true},{"id":"sb-iodz4","kind":"text","visible":true,"title":"Мысль дня","text":"Ещё рано знать. Всему своё время.","look":"thought"},{"id":"sb-tsfsq","kind":"text","visible":true,"title":"Практика","text":"**Собери диафильм своего дня.**\n\nНесколько раз в течение дня остановись на мгновение и запечатлей один кадр:\n\n**Что сейчас оказалось в фокусе моего внимания?**\n\nСохрани несколько таких кадров — словом, фотографией, короткой записью, образом.\n\nНе ищи между ними связи. Не пытайся понять, почему именно они. Сегодня достаточно их увидеть.","collapse":true},{"id":"sb-u0e2i","kind":"text","visible":true,"title":"След дня","text":"**Что сегодня само оказалось в фокусе моего внимания?**"}],"cover":"media/a8a178b0984740eec714.webp","shareImage":"media/851b5011d56bc867c36d.jpg"},{"id":"d-03gd9","visible":true,"routeId":"route-7my46","day":null,"title":"Итоги","order":4,"blocks":[{"id":"sb-6s0te","kind":"text","visible":true,"title":"Контур дня","text":"Станция 2 · Следы\nСладкое часто оказывается не началом истории, а её последней остановкой. Всё самое интересное происходит немного раньше.\n","collapse":true},{"id":"sb-liwhd","kind":"text","visible":true,"title":"Мысль дня","text":"🌿 Мантра дня\n\nСегодня я исследую привычный маршрут.","look":"thought"},{"id":"sb-w8qhf","kind":"text","visible":true,"title":"Практика","text":"🎯 ПРАКТИКА ДНЯ:\n\nПредставьте, что вы поднимаетесь на воздушном шаре высоко над своим днём.\n\nТам, с высоты не видно мелких деталей, но можно увидеть весь маршрут.\n\nПопробуйте мысленно посмотреть на свой день сверху.\n\nГде начинается тропинка, которая привела вас к сладкому? Какие остановки она проходит? Какие места повторяются чаще всего?\n\nНе пытайтесь вспоминать, поробуйте увидеть, наблюдайте.\n\nУ высоты совсем другой обзор, правда?\n\nВ течение дня мысленно говорите себе:\n\n- Набираю высоту.\n\nИ представляете, как поднимаетесь на воздушном шаре, рассматривая свой день с высоты.","collapse":true},{"id":"sb-9n62g","kind":"text","visible":true,"title":"След дня","text":"✏️ ЗАМЕТКИ НА ПОЛЯХ:\n\nСегодня я...\n——————\n\n• Посмотрел(а) на свой день с высоты\n• Нашёл(ла) повторяющиеся остановки на маршруте\n• Прошёл(ла) путь в обратном направлении\n• Записал(а) свои наблюдения"}],"cover":"media/89d3a6a5da24c36da7ee.webp","shareImage":"media/3b1f94aeb46c62136e94.jpg"},{"id":"d-3bp34","visible":true,"routeId":"route-q5dqb","day":null,"title":"День 1","blocks":[{"id":"sb-1g3za","kind":"text","visible":true,"title":"Контур дня","text":"Отражение - 1\nПредставьте...\nКак огромное облако газа и пыли становится пространством возможного. \nВ хаотическом веществе ещё нельзя разглядеть будущую форму, но где-то внутри него возникают условия, при которых одна из бесчисленных возможностей получает шанс стать событием.\n\nЕщё ничего не произошло. Нет формы, нет ответа, нет понимания направления движения. \n\nНо уже есть точка начала, в которой среди огромного количества возможного именно это может обрести реальность.\n\nВ поле неизвестного появляется область будущего события.","collapse":true},{"id":"sb-des49","kind":"text","visible":true,"title":"Главный вопрос","text":"Как сегодня звучит самый важный вопрос к самому себе?","collapse":true}],"order":5,"cover":"media/8392362a0783ab1c601e.webp","shareImage":"media/cf9379581028e0b59422.jpg"},{"id":"d-zpdr9","visible":true,"routeId":"route-fsu0w","day":null,"title":"День 1","blocks":[{"id":"sb-f6evy","kind":"text","visible":true,"title":"Контур дня","text":"Итак, Маршрут начинается.\n\nЕсть Город - моя повседневная жизнь. Она наполнена смыслами и автоматизмами.\n\nИ на первый взгляд, каждый сладкий герой - добропорядочный гражданин.","collapse":true},{"id":"sb-sr69o","kind":"text","visible":true,"title":"🔴 Вопросы для поиска улик.","text":"⁉️Что сегодня из сладкого  было на вашем столе?\nА во рту? 🎂\n\n⁉️Что именно цепляет вас в этой еде? Вкус? Запах? Текстура? Послевкусие?\n\n⁉️ Чем можно заменить вашу прелесть? 🍡"}],"order":6,"cover":"media/f961aa3d7fa1990e9bd9.webp","shareImage":"media/212de74c96ccb8959d23.jpg"}],"chronicles":[{"id":"c-white-wizard-1","visible":true,"order":1,"routeId":"white-wizard","name":"Летопись · пример 1","blocks":[{"id":"sb-ptxz2","kind":"text","visible":true,"title":"Фрагмент Летописи","text":"Маршрут не ответил за тебя, нужно ли покупать швейную машину.\n\nИ, возможно, сейчас важнее другое.\n\nОн сделал видимым один участок пути.\n\nТы заметил момент, когда захотелось быстрого результата. И в этот раз не остановился на нём.\n\nТы вернул внимание к процессу. И завершил начатое.\n\nВозможно, одна из важных дорожек сейчас проходит здесь:\n- не требовать от будущего гарантии до начала пути;\n- позволять образу постепенно становиться формой;\n- не оставлять тело за пределами этого процесса;\n- давать созданному достаточно времени, прежде чем решать, чему из этого жить дальше.","collapse":true}],"shareImage":"media/336f9a1f543f954be35d.jpg"},{"id":"c-white-wizard-2","visible":true,"order":2,"routeId":"white-wizard","name":"Летопись · пример 2","blocks":[{"id":"sb-4auus","kind":"text","visible":true,"title":"Фрагмент Летописи","text":"Маршрут не объясняет, почему в твоей жизни начался период трансформирующих событий и что именно изменится дальше.\n\nНо в оставленных тобой Следах он делает видимым один способ движения.\n\nТы замечаешь происходящее довольно рано — ещё до того, как появляется законченная история о нём.\n\nСначала через общее ощущение, затем через всё более конкретные телесные детали. В середине пути ты уже связываешь накопление маленьких шагов с изменением более крупного масштаба, а позднее совершаешь конкретное действие отпускания.\n\nВозможно, одна из важных дорожек здесь проходит через способность слышать ранние сигналы изменения, не требовать от них немедленного объяснения и давать новому достаточно времени, чтобы оно смогло проявить свою форму.","collapse":true}],"shareImage":"media/c8f7d265c4f577f0b1be.jpg"},{"id":"c-qv86w","visible":true,"routeId":"route-q5dqb","name":"Свидетельство · пример 1","blocks":[{"id":"sb-qzh4j","kind":"text","visible":true,"title":"Фрагмент Свидетельства о завершении маршрута","text":"К финалу маршрута отношения перестали занимать всю картину жизни. Рядом с ними появилась своя дорога: реализация, доход, проявленность, собственные интересы и возможность больше выбирать.\nНа вопрос «Что из прожитого за эти дни ты проносишь с собой дальше?» участница ответила:\n«Те действия-якоря, уверенное спокойствие и устойчивость в теме отношений. Состояние: я в игре».\nВчера было просто «игра». Сегодня — «я в игре».\nИ финальные слова Жёлтой Звезде:\n«Спасибо за твой Свет! Он стал частью меня!»","collapse":true}],"order":3,"shareImage":"media/55814c4a8445772519ba.jpg"}],"reviews":[{"id":"r-01","visible":true,"order":1,"text":"Это был совершенно неожиданный и даже спонтанный опыт такого исследования.\nИ это получилось очень глубоко и очень своевременно.\nМне кажется, я почти накануне начала марафона увидела у тебя в канале про «Маршрут Сладкоежки» и тут же залетела, потому что устала сама от себя и понимала, что мне, человеку, которому совершенно не свойственно «жрать», надо осознать про это что-то важное, чего сама я не понимаю.\nИ я могу сказать, что всё было построено настолько логично и последовательно, что моя психика начала распаковывать мне всё и сразу.\nСамое ценное для меня — это пробуждение «наблюдателя» и возможность смотреть на Нехочуху с благодарностью, задавать этой фигуре вопросы, не отворачиваться от неё и не затыкать рот едой.\nМне хватило абсолютно всего. Сейчас самое важное — удержать навык разговаривать с новой обнаруженной фигурой и не слиться в том, чтобы перестроить реакции.\nХочется чаще фиксировать себя на вопросах: а как делать по-другому? Есть ли варианты? А чего хочется? И научиться не пропускать момент, когда ресурса на возможность задать такой вопрос и остановить себя уже нет…\nСпасибо большое за энергию, за задания и за маршрут.\n","author":"Лилия","routeId":"route-7my46","month":"Июль 2026","source":"Telegram","signature":{"show":true}},{"id":"r-02","visible":true,"order":2,"text":"Лен, здесь, в твоём поле, в работе с тобой получилось не просто заметить, но и осознать, как работает «механизм» с замещением чего-либо посредством употребления в пищу сладкого! Более того — посмотреть шире и обратить внимание на разные свои привычки.\nИ да, не всё получается сразу, но в этом нужна практика и внимание к себе. Немало ещё работы предстоит...) Но благодаря тебе получилось сделать первый и самый важный шаг к осознанию этого и практике!\nЭто очень ценно!","author":"Илья","routeId":"route-7my46","month":"Июль 2026","source":"VK","signature":{"show":true}},{"id":"r-ld6zg","visible":true,"text":"Благодарю тебя за то, что провела меня по этому пути! Чувствовала и ощущала твое присутствие, любящий взгляд, бережную поддержку!\nОбнимаю тебя крыльями и своим новым Светом✨","author":"Ирина","routeId":"route-q5dqb","month":"","source":"Telegram","signature":{"show":true},"order":3}],"signatureText":"Опубликовано с разрешения. Орфография и пунктуация отредактированы, смысл сохранён.","labels":{"day":"День {n}","meaning":"Контур дня","question":"Главный вопрос","practice":"Практика {n}","trace":"След дня","fragment":"Фрагмент Летописи","lens":"Линза 13 MIRRORS","review":"Отзыв","thought":"Мысль дня","practiceOne":"Практика"},"look":{"background":{"color":"#0d0a07","image":"media/e92f338f61f2279f939a.webp","dim":55,"blur":8,"imageTall":"media/4ab75352b39b4748cc9a.webp"},"font":"Cormorant Garamond","textColor":"#ecd4a3","headColor":"#ecd3a3","accent":"#0d0a07","panelBg":"#0d0a07","glass":30,"glassBlur":8,"textSize":"lg","win":{"mode":""},"lineH":"","imgGlass":{"on":true,"mark1":{},"mark2":{},"fit":"even","dates":false,"day":false,"kin":true},"tabs":{"active":"glass","glass":70,"rim":"glow"}},"intros":{"days":"Примеры дней на маршрутах","chronicles":"После завершения маршрута отдельные ответы, наблюдения и Следы можно собрать в персональную **Летопись участника маршрута**.\n\nЭто не пересказ заданий и не готовое объяснение человека.\nЛетопись возвращает участнику его собственный материал и помогает увидеть рисунок, который мог быть незаметен, пока проживались отдельные дни.","reviews":""}},"reflection":{"eyebrow":"Карта-Отражение","title":"Примеры","intro":"Каждая Карта-Отражение — это образ и архетип, собранные вокруг твоего кина. Здесь — несколько примеров. Полный персональный разбор — сильные стороны, тени и вопросы — всё описание собирается после прохождения 1-дневного индивидуального маршрута. \nТвои ответы на вопросы служат основой для сборки уникального архетипа 13 MIRRORS.","orderAction":{"show":true,"kind":"contact","label":"Заказать Карту-Отражение","message":"Здравствуйте! Хочу заказать Карту-Отражение."},"items":[{"id":"e-cfa7a","visible":true,"image":"media/5f34caa11c79fd4db233.webp","title":"Проводник пространств","text":"Чувствует пространство как живую среду и улавливает, где открывается проход в новое. Помогает выйти за пределы привычного, увидеть более широкий горизонт и услышать направление, которое уже откликается изнутри.","order":1,"meta":"Kin 33 · Красный Резонансный Небесный Странник","glass":{}},{"id":"e-kin232","visible":true,"order":2,"image":"media/5225e43ee14183bea96b.webp","meta":"Kin 232 · Жёлтый Спектральный Человек","title":"Носитель Осознанности","text":"Архетип свободной воли и осознанного выбора. Его линия — различать собственное решение среди привычек, страхов и чужих ожиданий и освобождать место для того, что действительно своё.","glass":{}},{"id":"e-kin182","visible":true,"order":3,"image":"media/cc9a372bce175027c49f.webp","meta":"Kin 182 · Белый Космический Ветер","title":"Хранитель Истинного Голоса","text":"Связан с внутренней истиной, словом и способностью слышать невысказанное. Рядом с ним другим бывает легче услышать себя — не из-за готовых ответов, а благодаря качеству присутствия.","glass":{}},{"id":"e-kin226","visible":true,"order":4,"image":"media/2f1253e0958e77e75e05.webp","meta":"Kin 226 · Белый Обертонный Соединитель Миров","title":"Ткачиха Переходов","text":"Создаёт пространство, в котором различное может встретиться, не теряя своей природы. В точках соприкосновения возникает свет, а из множества контактов складывается новый узор и открывается путь.","glass":{}},{"id":"e-kin68","visible":true,"order":5,"image":"media/bd719df5de3eeafb6a99.webp","meta":"Kin 68 · Жёлтая Электрическая Звезда","title":"Камертон Гармонии","text":"Помогает разрозненному становиться созвучным. Чувствует связи между людьми, идеями и событиями и создаёт пространство, в котором различия начинают дополнять друг друга.","glass":{}},{"id":"e-kin108","visible":true,"order":6,"image":"media/3dd700bbc1281d55928c.webp","meta":"Kin 108 · Жёлтая Самосущная Звезда","title":"Сияющий Художник","text":"Видит целостный образ ещё до того, как он стал очевидным, и помогает внутреннему замыслу обрести форму. Его произведением может стать проект, пространство, разговор или сама жизнь.","glass":{}}],"placeholder":"Изображение скоро появится","look":{"background":{"color":"#0d0a07","image":"media/e92f338f61f2279f939a.webp","dim":55,"blur":8,"imageTall":"media/4ab75352b39b4748cc9a.webp"},"font":"Cormorant Garamond","textColor":"","headColor":"#ecd3a3","accent":"#ecd3a3","panelBg":"#0d0a07","glass":25,"glassBlur":8,"textSize":"lg","imgGlass":{"mark1":{},"mark2":{}},"win":{}}},"events":{"eyebrow":"13 MIRRORS","title":"События","intro":"Встречи, медитации, фестивали и поездки 13 MIRRORS.\nНажмите на событие, чтобы узнать подробности.","tabs":{"soon":"Скоро","past":"Как это было","cases":"Примеры практик"},"items":[{"id":"ev-a4g8f","visible":true,"type":"meeting","title":"Город МАК","date":"2026-10-15","dateEnd":"","time":"","duration":120,"place":"Онлайн","price":"свободный вход","cover":"media/ad4ca7d2770fe5ec4071.webp","summary":"","archive":true,"blocks":[{"id":"sb-cz6sj","kind":"text","visible":true,"title":"О встрече","text":"Прогулка по улицам ассоциаций — от вашего текущего состояния к тому, в котором желание уже стало реальностью. Через МАК-карты, вопросы и живой маршрут мы будем искать не ответ «как получить желаемое», а состояние, из которого к нему можно идти.","collapse":true,"look":"normal","order":1},{"id":"sb-rvtle","kind":"images","visible":true,"images":[{"id":"img-pjjx4","src":"media/7468d785c0bcf6827ecb.webp","caption":"","visible":true,"order":1},{"id":"img-0hmn5","src":"media/579acc6dee2591b8ef81.webp","caption":"","visible":true,"order":2},{"id":"img-5zp8n"," th":"medium","glowDir":"bottom","patternColor":"#cfe0ff"}},"back":{"type":"blocks","routeId":"","blocks":[{"id":"b-jb9op5","kind":"desc","visible":true,"text":"Личное пространство для совместного исследования того, что важно для тебя сейчас."},{"id":"b-lx5uad","kind":"items","visible":true,"items":[{"id":"i-01","visible":true,"order":1,"title":"Индивидуальная встреча","duration":{"value":"до 90 минут","show":true},"price":{"value":"7 000 ₽","show":true},"action":{"kind":"contact","label":"Записаться"}},{"id":"i-02","visible":true,"order":2,"title":"Шаманская работа на колесе","duration":{"value":"До 60 минут","show":true},"price":{"value":"3 500 ₽","show":true},"action":{"kind":"contact","label":"Узнать подробности"}},{"id":"i-tt1vb","visible":true,"order":3,"title":"Регрессионная сессия","duration":{"value":"до 180 минут","show":true},"price":{"value":"8 000 ₽","show":true},"action":{"kind":"contact","label":"Записаться"}},{"id":"i-c1kgs","visible":true,"order":4,"title":"Расстановки","duration":{"value":"","show":true},"price":{"value":"5 000 ₽","show":true},"action":{"kind":"contact","label":"Записаться"}}],"max":10,"copyItems":true,"tpl":"container"}]}}],"cardStyle":{"font":"Cormorant Garamond","textColor":"#f4ead8","glowDir":"bottom","glow":"off","glass":95,"accent":"#ecd3a3","overlay":"dark","backBg":"#0d0a07","glassBlur":0,"rim":"gold","textHelp":"shadow","pattern":"none","patternPlace":"corners","patternOpacity":55,"smallSize":"lg","backSize":"lg","backGlass":60,"backBlur":4,"btnStyle":"gradient","btnColor":"#f8e7bf","btnColor2":"#c49a5a","btnDir":"diag","btnLive":"glint","rimLive":"none","win":{},"lid":{"open":"","from":"left","speed":"slow","pause":0.5,"shadow":"deep","mat":"color","glass":35,"blur":8,"rim":"gold","feel":"soft"},"iconShape":"bare","closeMark":"ring"},"head":{"color":"#ecd3a3","align":"center","top":"none","bottom":"both","bottomSize":"m","shine":true,"shineColor":"#faebb5","bottomText":"Увидимся за поворотом ","bottomAlign":"center","star":"after","starKind":"spark","bottomHaze":"dark","bottomHazeK":95,"topHaze":"dark","sheenKind":"soft","waveSpeed":"slow","topHazeK":90,"hideTitle":false}}},"journeys":{"items":[{"id":"yellow-sun","routeId":"yellow-sun","path":"routes/yellow-sun/","start":"2026-10-05","scene":"","dayClock":"","dayCard":{"blocks":[{"id":"image","kind":"image","visible":true,"who":{"observation":true,"journey":true,"immersion":true}},{"id":"head","kind":"small","visible":true,"who":{"observation":true,"journey":true,"immersion":true},"text":"День {день} · Kin {кин}"},{"id":"title","kind":"title","visible":true,"who":{"observation":true,"journey":true,"immersion":true},"text":"{имя кина}"},{"id":"meta","kind":"small","visible":true,"who":{"observation":true,"journey":true,"immersion":true},"text":"Печать {печать} · тон {тон}"},{"id":"focus","kind":"text","visible":true,"who":{"observation":true,"journey":true,"immersion":true},"label":"Фокус дня"},{"id":"mainQuestion","kind":"question","visible":true,"who":{"observation":true,"journey":true,"immersion":true},"label":"Главный вопрос"}],"align":"center"},"final":{"blocks":{"focus":true,"mainQuestion":false,"head":true,"image":true,"meta":false}},"days":[{"n":1,"kin":40,"kinName":"Жёлтое Магнитное Солнце","seal":"Жёлтое Солнце","tone":"Магнитный","image":"media/5d4cdde73ef322c15bbe.webp","cardOperation":"Где я на этом колесе сейчас","environment":"жизнь, свет, видимость","texts":{"focus":"Первый день волны. Магнитный тон задаёт направление, Солнце даёт свет. Сегодня важно не делать, а заметить, куда тянется ваше внимание и что вдруг становится видимым и тёплым. Это может быть мелочь: разговор, к которому возвращаются мысли, дело, о котором вспоминаете с теплом, место, куда хочется зайти. Понимать, зачем это, пока не нужно, достаточно заметить.","mainQuestion":"Что сейчас притягивает моё внимание и зовёт меня вперёд?","personalQuestion":"[заготовка] Вопрос дня к карте «{качество}»","personalPractice":"Обратите сегодня внимание, в каких ситуациях вам хочется проявить {качество}, а в каких нет.","closingPoint":"Одной фразой: для чего мне это?","diskQuestion":"Вспомните ситуацию, которая потребовала от вас {качества}. Отметьте на диске, где вы тогда оказались, по вашим ощущениям.","focusTitle":"Свет, который зовёт"}},{"n":2,"kin":41,"kinName":"Красный Лунный Дракон","seal":"Красный Дракон","tone":"Лунный","image":"media/6e13dce1fb4ba588ea5b.webp","cardOperation":"Что в сегодняшней карте особенно цепляет меня через других","environment":"опора, исток, что питает","texts":{"focus":"Любое начало встречает сопротивление. Дракон — это то, что питает и даёт жизнь, а Лунный тон показывает обе стороны: что даёт силы и что их забирает. Посмотрите на свой обычный день: после чего становится легче, а после чего хочется лечь и ничего не делать? Иногда питает и истощает одно и то же, например любимая работа, когда её слишком много.","mainQuestion":"Что меня питает, а что истощает?","personalQuestion":"[заготовка] Вопрос дня к карте «{качество}»","personalPractice":"Найдите сегодня одну ситуацию, где {качество} даётся вам с усилием. Что мешает? Просто заметьте, ничего не исправляя.","closingPoint":"Назовите то, что сегодня мешало, без оценки. Теперь у этого есть имя.","diskQuestion":"Вспомните ситуацию, которая проверяла {ваше качество}. Коснитесь той области диска, где вы тогда оказались, на ваш взгляд.","focusTitle":"Опора и вызов"}},{"n":3,"kin":42,"kinName":"Белый Электрический Ветер","seal":"Белый Ветер","tone":"Электрический","image":"media/67bec85505ad873f20f6.webp","cardOperation":"Проверяю: есть ли в моей реакции что-то моё","environment":"дыхание, голос, слово","texts":{"focus":"Ветер — это дыхание и речь, Электрический тон запускает движение. Сегодня внимание к тому, как вы дышите и что говорите: где слово живое, а где застряло. Заметьте, где вы промолчали, хотя хотелось сказать, или сказали не то, что думали. Дыхание часто подсказывает раньше слов: перед важной фразой оно замирает.","mainQuestion":"Что просится быть сказанным вслух?","personalQuestion":"[заготовка] Вопрос дня к карте «{качество}»","personalPractice":"Сделайте сегодня один маленький шаг: осознанно проявите {качество} в простой, обычной ситуации.","closingPoint":"Что-то изменилось после этого шага, в вас или вокруг?","diskQuestion":"Вспомните первый случай, который приходит в голову, когда понадобилось немного {качества}. Вы тогда были в центре или вас куда-то качнуло? Отметьте это место.","focusTitle":"Дыхание и слово"}},{"n":4,"kin":43,"kinName":"Синяя Самосущая Ночь","seal":"Синяя Ночь","tone":"Самосущий","image":"media/ac22ab46311777bb6faa.webp","cardOperation":"Даю форму неприсвоенной стороне сегодняшнего качества","environment":"интуиция, сновидение, образ","texts":{"focus":"Ночь хранит мечты и предчувствия, Самосущий тон даёт им форму. Сегодня можно присмотреться к тому, о чём мечтается, даже если мечта кажется наивной или далёкой. План составлять не нужно, просто представьте её первый, самый простой облик. Иногда у мечты очень обычное лицо: вечер без спешки, поездка, разговор, на который давно не решались.","mainQuestion":"Какую форму может принять то, о чём я мечтаю?","personalQuestion":"[заготовка] Вопрос дня к карте «{качество}»","personalPractice":"Понаблюдайте сегодня, в чём у вас проявляется {качество}: в каких словах, жестах, действиях.","closingPoint":"Попробуйте описать тремя словами, как это выглядит у вас.","diskQuestion":"Вспомните ситуацию, в которой вы проявили {ваше качество} или не проявили. Если посмотреть на неё через этот диск, где вы тогда были?","focusTitle":"Форма для мечты"}},{"n":5,"kin":44,"kinName":"Жёлтое Обертонное Семя","seal":"Жёлтое Семя","tone":"Обертонный","image":"media/8312b04c18e3ee77e1e7.webp","cardOperation":"Нахожу силу, которая прячется на изнанке","environment":"потенциал, рост, фокус","texts":{"focus":"Семя уже знает, чем станет, а Обертонный тон добавляет ему силы. Сегодня день заметить, что в вас уже набралось сил и готово выйти на свет. Новые цели тут ни при чём. Речь о том, что уже есть: умение, желание, решение, к которому вы давно подходите. Ему нужно только место.","mainQuestion":"Что во мне уже готово прорасти?","personalQuestion":"[заготовка] Вопрос дня к карте «{качество}»","personalPractice":"Замечайте сегодня, в какие моменты, рядом с кем, где и в каком состоянии {качество} даётся вам легко.","closingPoint":"Что сегодня дало вам силу?","diskQuestion":"Вспомните случай, когда для вас было важно проявить {качество}. В какой точке диска вы тогда стояли, как вам кажется?","focusTitle":"Сила роста"}},{"n":6,"kin":45,"kinName":"Красный Ритмический Змей","seal":"Красный Змей","tone":"Ритмический","image":"media/3f281d164550ac9904f0.webp","cardOperation":"Нахожу меру: где ось переходит в спицу","environment":"тело, инстинкт, жизненная сила","texts":{"focus":"Змей — это тело, инстинкт, жизненная сила. Ритмический тон ищет равновесие. Сегодня главный ориентир — тело: чего ему хватает, а чего не хватает: движения, отдыха, тепла, сна. Обычно мы слышим тело, только когда оно болит. Сегодня попробуйте спросить его раньше и сделать в ответ одну простую вещь.","mainQuestion":"Чего сейчас просит моё тело?","personalQuestion":"[заготовка] Вопрос дня к карте «{качество}»","personalPractice":"Если сегодня вам придётся проявить {качество}, сверьтесь с диском: вы ближе к центру или вас качнуло к краю?","closingPoint":"Где сегодня вы чувствовали равновесие?","diskQuestion":"Вспомните ситуацию, в которой нужно было найти меру {качества}. Вы были ближе к центру или к краю? Покажите.","focusTitle":"Равновесие тела"}},{"n":7,"kin":46,"kinName":"Белый Резонансный Соединитель Миров","seal":"Белый Соединитель Миров","tone":"Резонансный","image":"media/11a4e411999055712b09.webp","cardOperation":"Слушаю отклик на непривычное качество","environment":"переход, отпускание старой позиции","texts":{"focus":"Седьмой день — середина волны: шесть дней позади, шесть впереди. Соединитель миров стоит на границе между тем, что было, и тем, что будет. Сегодня день не добавлять нового, а остановиться и стать тише. Можно несколько минут посидеть без телефона и музыки и послушать, что всплывает, когда ничего не отвлекает.","mainQuestion":"Что я слышу в себе, когда становится тише?","personalQuestion":"[заготовка] Вопрос дня к карте «{качество}»","personalPractice":"Сегодня, когда понадобится {качество}, сначала остановитесь на три вдоха и прислушайтесь к телу: как оно реагирует?","closingPoint":"Какой телесный отклик вы сегодня услышали?","diskQuestion":"Произнесите про себя слово «{качество}» и вспомните ситуацию, которая откликнется первой. Какая часть диска откликается на это воспоминание? Коснитесь её.","focusTitle":"Середина пути"}},{"n":8,"kin":47,"kinName":"Синяя Галактическая Рука","seal":"Синяя Рука","tone":"Галактический","image":"media/560f9f14ffb765a32cbd.webp","cardOperation":"С сегодняшней картой ищу возвращение в ось: как могут сосуществовать обе стороны качества","environment":"знание через делание, забота","texts":{"focus":"После середины начинается сборка. Рука — это умение делать, Галактический тон соединяет части в целое. За прошедшие дни вы что-то заметили и что-то поняли. Сегодня одно небольшое дело может связать это с обычной жизнью: позвонить, записать, переставить, начать. Понимание закрепляется, когда руки что-то сделали.","mainQuestion":"Какое действие поможет соединить то, что мне уже открылось?","personalQuestion":"[заготовка] Вопрос дня к карте «{качество}»","personalPractice":"Сегодня, проявляя {качество}, сверьтесь: совпадает ли то, что вы говорите, чувствуете и делаете? Если нет, то в какие моменты?","closingPoint":"Было ли сегодня что-то, где сошлись слова, чувства и поступки?","diskQuestion":"Вспомните ситуацию, когда жизнь попросила у вас {качества}. Если совсем честно, где вы тогда были? Найдите это место.","focusTitle":"Собрать через действие"}},{"n":9,"kin":48,"kinName":"Жёлтая Солнечная Звезда","seal":"Жёлтая Звезда","tone":"Солнечный","image":"media/d9c1e1be3b1168830d1c.webp","cardOperation":"Из встречи с сегодняшним качеством рождается одно намерение","environment":"красота, гармония","texts":{"focus":"Звезда — это красота и гармония, Солнечный тон — ясное намерение. Сегодня день выбрать, какую красоту вы хотите впустить в свою жизнь, и сделать для этого шаг. Речь не о внешности и не об идеальном порядке, а о том, от чего становится хорошо: цветы на столе, музыка утром, аккуратно сделанная работа, бережный разговор.","mainQuestion":"Какую красоту я хочу сознательно привнести в свою жизнь?","personalQuestion":"[заготовка] Вопрос дня к карте «{качество}»","personalPractice":"Выберите одно дело, которое откладываете, и доведите его до конца, добавив в него немного {качества}.","closingPoint":"Получилось? Что теперь сделано? Дайте имя одному конкретному результату.","diskQuestion":"Вспомните, как вы однажды собирались проявить {качество}. Чем всё закончилось? Поставьте метку туда, где вы тогда были.","focusTitle":"Намерение и красота"}},{"n":10,"kin":49,"kinName":"Красная Планетарная Луна","seal":"Красная Луна","tone":"Планетарный","image":"media/9499ee627e3c7fbf3d1a.webp","cardOperation":"Один видимый поступок, в котором сегодняшнее качество проявляется ближе к оси","environment":"поток, движение","texts":{"focus":"Луна — это вода и поток, Планетарный тон проявляет задуманное в мире. Сегодня то, что долго зрело, может легко перейти в дело, если не перегораживать ему путь. Присмотритесь, что вы откладываете по привычке или из страха, хотя на самом деле готовы. Иногда достаточно перестать мешать, и дело пойдёт само.","mainQuestion":"Что сегодня может свободно перетечь из замысла в дело?","personalQuestion":"[заготовка] Вопрос дня к карте «{качество}»","personalPractice":"Посмотрите сегодня, что в вашей жизни уже сложилось благодаря тому, что в вас есть {качество}: в делах, в отношениях, в вас самих.","closingPoint":"Назовите один плод.","diskQuestion":"Вспомните, когда другие видели {ваше качество}. Если перенести тот момент на диск, куда он ляжет?","focusTitle":"Поток в дело"}},{"n":11,"kin":50,"kinName":"Белая Спектральная Собака","seal":"Белая Собака","tone":"Спектральный","image":"media/71fab7f8b242047e7365.webp","cardOperation":"Перестаю делать привычное «слишком»","environment":"сердце, верность себе","texts":{"focus":"Собака — это сердце, верность, любовь. Спектральный тон освобождает. Сегодня день отпустить лишнее напряжение: обиду, которую давно носите, обязательство, которое уже не ваше, привычку всё держать под контролем. Заметьте, рядом с кем и в какие моменты сердцу становится свободнее.","mainQuestion":"Что освобождает моё сердце?","personalQuestion":"[заготовка] Вопрос дня к карте «{качество}»","personalPractice":"Заметьте, где {качество} превращается для вас в обязанность, и в этот момент поступите немного иначе.","closingPoint":"В чём сегодня стало легче?","diskQuestion":"Вспомните момент, когда вам нужно было немного {качества}, а что-то вас держало. Где оно вас держало: в центре, на плоскости, на краю или за диском?","focusTitle":"Свободное сердце"}},{"n":12,"kin":51,"kinName":"Синяя Кристаллическая Обезьяна","seal":"Синяя Обезьяна","tone":"Кристаллический","image":"media/14835035aba07dfdbb34.webp","cardOperation":"Проверяю новое качество в контакте с другим","environment":"игра, лёгкость пробы","texts":{"focus":"Обезьяна — это игра и лёгкость, Кристаллический тон — делать вместе. Серьёзное сегодня не нужно отменять, его можно прожить чуть легче, рядом с другими. Попробуйте пошутить там, где обычно напрягаетесь, или разрешить себе ошибку без самокритики. Лёгкость часто приходит, когда не нужно тянуть всё в одиночку.","mainQuestion":"Что можно сегодня сделать играючи, вместе с кем-то?","personalQuestion":"[заготовка] Вопрос дня к карте «{качество}»","personalPractice":"Сделайте сегодня что-то вместе с другим человеком и посмотрите, как {качество} звучит у вас и у другого. Что другой вам подсвечивает?","closingPoint":"Что вам сегодня подсветили другие?","diskQuestion":"Вспомните,
