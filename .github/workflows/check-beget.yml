# Проверка копии сайта на Beget (шаг 4 переезда). Ничего не меняет ни на Beget, ни в репозиториях:
# только читает сайт с сервера Beget так, как будто 13mirrors.ru уже смотрит туда,
# и сравнивает каждый файл с тем, что лежит в main обоих репозиториев.
name: Проверка копии на Beget

on:
  workflow_dispatch:        # Actions → «Проверка копии на Beget» → Run workflow
    inputs:
      quick:
        description: 'Быстро: только https и сертификат (без сверки файлов и снимков)'
        type: boolean
        default: false

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'     # строки журнала — сразу, даже если шаг застрянет
  BEGET_HOST: evraspyn.beget.tech
  SITE: 13mirrors.ru

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, path: v }
      - uses: actions/checkout@v4
        with: { repository: elenarasprugina/elenarasprugina.github.io, ref: main, path: h }

      - name: Адрес сервера
        run: |
          ip=$(getent ahostsv4 "$BEGET_HOST" | awk 'NR==1{print $1}')
          echo "Beget ($BEGET_HOST): $ip"; echo "BEGET_IP=$ip" >> "$GITHUB_ENV"
          echo "13mirrors.ru сейчас смотрит на:"; getent ahostsv4 "$SITE" | awk '{print $1}' | sort -u

      - name: Файлы — байт в байт
        if: ${{ !inputs.quick }}
        run: |
          python3 - <<'EOF'
          import os, hashlib, http.client, urllib.parse
          ip, site = os.environ['BEGET_IP'], os.environ['SITE']
          def get(path):
              c = http.client.HTTPConnection(ip, 80, timeout=30)
              c.request('GET', urllib.parse.quote(path), headers={'Host': site, 'User-Agent': 'check'})
              r = c.getresponse(); body = r.read(); c.close()
              return r.status, dict((k.lower(), v) for k, v in r.getheaders()), body
          skip = {'.git', '.github', 'README.md', 'CNAME', 'CLAUDE.md', '.htaccess'}
          want = []
          for root, pref, extra in (('h', '/', {'vitrina'}), ('v', '/vitrina/', {'docs'})):
              for d, dirs, files in os.walk(root):
                  rel = os.path.relpath(d, root)
                  if rel == '.':
                      dirs[:] = [x for x in dirs if x not in skip | extra]
                  for f in files:
                      p = os.path.normpath(os.path.join(rel, f))
                      if rel == '.' and f in skip: continue
                      want.append((pref + p, os.path.join(d, f)))
          ok, bad, types = 0, [], {}
          for url, local in sorted(want):
              st, h, body = get(url)
              mine = open(local, 'rb').read()
              ext = os.path.splitext(url)[1] or '(нет)'
              types.setdefault(ext, set()).add(h.get('content-type', '?'))
              if st == 200 and body == mine: ok += 1
              else: bad.append('%s  статус %s, размер %d вместо %d' % (url, st, len(body), len(mine)))
          print('Файлов проверено: %d, совпали байт в байт: %d' % (len(want), ok))
          for b in bad: print('  НЕ СОВПАЛ:', b)
          print('\nТипы файлов, которые отдаёт сервер:')
          for e in sorted(types): print('  %-6s %s' % (e, ', '.join(sorted(types[e]))))
          print('\nАдреса без имени файла:')
          for p in ['/', '/grimoire/', '/grimoire', '/vitrina/', '/vitrina', '/vitrina/2026-10/',
                    '/vitrina/events/', '/vitrina/admin/', '/net-takoj-stranicy/', '/.13mirrors-deploy-root', '/cgi-bin/', '/vitrina/.htaccess']:
              st, h, body = get(p)
              print('  %-26s %s %s %s' % (p, st, h.get('content-type', ''), ('→ ' + h['location']) if 'location' in h else ''))
          st, h, body = get('/vitrina/data/events.json')
          print('\nЗаголовки events.json:')
          for k in ('server', 'content-type', 'cache-control', 'expires', 'etag', 'last-modified', 'content-encoding'):
              print('  %s: %s' % (k, h.get(k, '—')))
          if bad: raise SystemExit(1)
          EOF

      - name: Память браузера и сжатие
        if: always()
        run: |
          python3 - <<'EOF'
          import os, glob, socket, ssl, http.client
          ip, site = os.environ['BEGET_IP'], os.environ['SITE']
          js = open('v/index.html').read().split('vitrina.js?v=')[1].split('"')[0]
          media = sorted(glob.glob('v/media/*'))
          paths = ['/', '/vitrina/', '/vitrina/admin/', '/vitrina/2026-10/', '/vitrina/data/settings.json', '/vitrina/data/showcases/2026-10.json',
                   '/vitrina/assets/vitrina.js?v=' + js, '/vitrina/assets/vitrina.css?v=' + js,
                   '/favicon.svg', '/assets/door-wide.webp', '/assets/og.jpg']
          paths += ['/vitrina/media/' + os.path.basename(m) for m in media[:2]]
          class HTTPSToIP(http.client.HTTPSConnection):
              def connect(self):
                  s = socket.create_connection((ip, 443), timeout=30)
                  self.sock = self._context.wrap_socket(s, server_hostname=self.host)
          def ask(scheme, host, path):
              if scheme == 'https':
                  c = HTTPSToIP(host, 443, timeout=30, context=ssl.create_default_context())
              else:
                  c = http.client.HTTPConnection(ip, 80, timeout=30)
              c.request('GET', path, headers={'Host': host, 'User-Agent': 'check', 'Accept-Encoding': 'gzip'})
              r = c.getresponse(); body = r.read(); c.close()
              return r.status, dict((k.lower(), v) for k, v in r.getheaders()), len(body)
          for scheme in ('http', 'https'):
              print('\n=== %s://%s ===' % (scheme, site))
              try:
                  for p in paths:
                      st, h, n = ask(scheme, site, p)
                      print('%-48s %s  %-28s cache-control: %-30s expires: %-31s сжатие: %-5s %d байт%s' % (
                          p[:48], st, h.get('content-type', '')[:28], h.get('cache-control', '—'), h.get('expires', '—'),
                          h.get('content-encoding', '—'), n, ('  → ' + h['location']) if 'location' in h else ''))
              except Exception as e:
                  print('  не отвечает: %s' % e)
              for host in ('www.' + site, site):
                  for p in ('/', '/vitrina/'):
                      try:
                          st, h, n = ask(scheme, host, p)
                          print('  %s://%s%s → %s %s' % (scheme, host, p, st, h.get('location', '')))
                      except Exception as e:
                          print('  %s://%s%s → не отвечает: %s' % (scheme, host, p, e))
          try:
              c = ssl.create_default_context().wrap_socket(socket.create_connection((ip, 443), timeout=30), server_hostname=site)
              cert = c.getpeercert(); c.close()
              print('\nСертификат: выдан %s, для %s, действует до %s' % (
                  dict(x[0] for x in cert['issuer']).get('organizationName'),
                  ', '.join(v for k, v in cert.get('subjectAltName', ())), cert['notAfter']))
          except Exception as e:
              print('\nСертификата для %s на Beget пока нет: %s' % (site, e))
          EOF

      - name: Страницы в браузере
        if: ${{ always() && !inputs.quick }}
        timeout-minutes: 8
        run: |
          pip install -q playwright && python3 -m playwright install --with-deps chromium > /dev/null
          mkdir shots
          python3 - <<'EOF'
          import os
          from playwright.sync_api import sync_playwright
          ip, site = os.environ['BEGET_IP'], os.environ['SITE']
          pages = ['/', '/grimoire/', '/vitrina/', '/vitrina/2026-10/', '/vitrina/2026-10/blue/',
                   '/vitrina/events/', '/vitrina/events/ev-a4g8f/', '/vitrina/reflection/',
                   '/vitrina/sandbox/', '/vitrina/admin/']
          with sync_playwright() as p:
              b = p.chromium.launch(args=['--host-resolver-rules=MAP %s %s, MAP www.%s %s' % (site, ip, site, ip)])
              for w, h, tag in ((390, 844, 'phone'), (1440, 900, 'pc')):
                  ctx = b.new_context(viewport={'width': w, 'height': h}, device_scale_factor=2 if w < 500 else 1)
                  for path in pages:
                      pg = ctx.new_page(); errs = []
                      pg.on('console', lambda m: m.type == 'error' and errs.append('консоль: ' + m.text))
                      pg.on('pageerror', lambda e: errs.append('ошибка: %s' % e))
                      pg.on('requestfailed', lambda r: errs.append('не загрузилось: ' + r.url))
                      pg.on('response', lambda r: r.status >= 400 and errs.append('%s: %s' % (r.status, r.url)))
                      pg.goto('http://%s%s' % (site, path), wait_until='networkidle', timeout=60000)
                      pg.wait_for_timeout(1500)
                      n_img = pg.evaluate('Array.prototype.filter.call(document.images,function(i){return i.complete&&i.naturalWidth>0}).length')
                      n_txt = pg.evaluate('document.body.innerText.length')
                      print('%-5s %-28s текст %5d букв, картинок %2d, «%s»' % (tag, path, n_txt, n_img, pg.title()))
                      for e in errs: print('        ' + e)
                      name = path.strip('/').replace('/', '_') or 'home'
                      pg.screenshot(path='shots/%s-%s.png' % (tag, name), full_page=(path != '/vitrina/admin/'))
                      pg.close()
                  ctx.close()
              b.close()
          EOF

      - uses: actions/upload-artifact@v4
        if: ${{ always() && !inputs.quick }}
        with: { name: snimki, path: shots, retention-days: 3 }
