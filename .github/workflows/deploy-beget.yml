# Пересылка витрины на хостинг Beget.
# После каждого изменения в main (в том числе после кнопки «Опубликовать» в панели)
# файлы этого репозитория копируются ТОЛЬКО в папку vitrina/ сайта 13mirrors.ru.
# Файлы главной страницы (всё, что вне vitrina/) эта пересылка не трогает.
# Вход — отдельный аккаунт Beget evraspyn_site, у которого доступ только к папке сайта.
# Нужно в Settings → Secrets and variables → Actions:
#   Secrets   → BEGET_PASSWORD — пароль этого аккаунта (в журнал не выводится);
#   Variables → BEGET_HOSTKEY  — отпечаток сервера Beget (первый запуск покажет его и остановится).
# В папке сайта на Beget должен лежать пустой файл-метка .13mirrors-deploy-root.
name: Пересылка на Beget

on:
  push:
    branches: [main]
  workflow_dispatch:        # кнопка «Run workflow» — запустить вручную

concurrency:
  group: beget-vitrina
  cancel-in-progress: false

permissions:
  contents: read

env:
  BEGET_HOST: evraspyn.beget.tech
  BEGET_USER: evraspyn_site
  TARGET: vitrina           # единственная папка на сервере, в которую пишет эта пересылка
  MARKER: .13mirrors-deploy-root

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Подготовка
        env:
          LFTP_PASSWORD: ${{ secrets.BEGET_PASSWORD }}
        run: |
          if [ -z "$LFTP_PASSWORD" ]; then
            echo "::error::Нет пароля: добавьте BEGET_PASSWORD в Settings → Secrets and variables → Actions → Secrets"
            exit 1
          fi
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp > /dev/null

      - name: Отпечаток сервера
        env:
          BEGET_HOSTKEY: ${{ vars.BEGET_HOSTKEY }}
        run: |
          # Пересылка разговаривает только с сервером, чей отпечаток закреплён в BEGET_HOSTKEY.
          # Если отпечаток ещё не закреплён — показываем его и останавливаемся, ничего не копируя.
          ssh-keyscan -T 20 -t ed25519 "$BEGET_HOST" 2>/dev/null > "$RUNNER_TEMP/scanned" || true
          echo "Отпечаток сервера $BEGET_HOST сейчас:"
          ssh-keygen -lf "$RUNNER_TEMP/scanned" || true
          if [ -z "$BEGET_HOSTKEY" ]; then
            echo "Строка для BEGET_HOSTKEY (скопировать целиком):"
            cat "$RUNNER_TEMP/scanned"
            echo "::error::Отпечаток сервера не закреплён. Скопируйте строку выше в Settings → Secrets and variables → Actions → Variables → BEGET_HOSTKEY и запустите снова. Ничего не скопировано."
            exit 1
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$BEGET_HOSTKEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Проверка, что мы в папке сайта
        env:
          LFTP_PASSWORD: ${{ secrets.BEGET_PASSWORD }}
        run: |
          # 1) В папке должен лежать файл-метка .13mirrors-deploy-root — значит, это папка сайта.
          # 2) Не должно быть видно папок уровнем выше (public_html, 13mirrors.ru, evraspyn.beget.tech).
          # Если что-то не так — останавливаемся, ничего не копируя и не удаляя.
          lftp -c "set cmd:fail-exit yes; set net:max-retries 3; set net:timeout 30;
                   set sftp:connect-program 'ssh -a -x -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts';
                   open --env-password -u $BEGET_USER sftp://$BEGET_HOST;
                   pwd; cls -1a" > "$RUNNER_TEMP/list.txt"
          cat "$RUNNER_TEMP/list.txt"
          if ! grep -qxF "$MARKER" "$RUNNER_TEMP/list.txt"; then
            echo "::error::В папке на Beget нет файла-метки $MARKER. Пересылка остановлена, ничего не изменено."
            exit 1
          fi
          if grep -qE '^(public_html|13mirrors\.ru|evraspyn\.beget\.tech)/?$' "$RUNNER_TEMP/list.txt"; then
            echo "::error::Аккаунт открывает не папку сайта, а уровень выше. Пересылка остановлена, ничего не изменено."
            exit 1
          fi

      - name: Пересылка в vitrina/
        env:
          LFTP_PASSWORD: ${{ secrets.BEGET_PASSWORD }}
        run: |
          # mirror --delete работает только внутри папки vitrina/: там сервер становится
          # точной копией репозитория (удалённое в репозитории удаляется и там).
          # Служебное (.git, .github, docs, CLAUDE.md, README.md) на сайт не попадает.
          # Каждый файл сначала загружается целиком под временным именем (.up-…) и потом одним движением встаёт на место.
          # Раньше файл переписывался прямо на месте: кто открывал сайт в эту минуту, получал пустой или обрезанный файл,
          # а браузер мог его запомнить (02.10.2026 так «сломалась» панель в Chrome). Недогруженные .up-… следующая пересылка удалит сама.
          # Если сервер не даст заменить файл переименованием — запасной путь: как раньше, прямо на месте (с предупреждением).
          send() {
            lftp -c "set cmd:fail-exit yes; set net:max-retries 3; set net:timeout 30; $1
                     set sftp:connect-program 'ssh -a -x -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts';
                     open --env-password -u $BEGET_USER sftp://$BEGET_HOST;
                     mirror --reverse --delete --parallel=4 --no-perms --verbose=1 \
                       --exclude-glob .git/ --exclude-glob .github/ --exclude-glob docs/ \
                       --exclude-glob CLAUDE.md --exclude-glob README.md --exclude-glob CNAME \
                       . $TARGET"
          }
          if ! send "set xfer:use-temp-file yes; set xfer:temp-file-name .up-*;"; then
            echo "::warning::Не получилось заменить файлы через временные — пересылаю как раньше, прямо на месте."
            send ""
          fi
