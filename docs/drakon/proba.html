<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Дракон из света</title>
<style>
:root { --bg:#05060c; --ink:#efe6d4; --dim:rgba(239,230,212,.55); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#05060c; } }
:root[data-theme="dark"] { --bg:#05060c; }
html,body { margin:0; height:100%; background:var(--bg); color:var(--ink); overflow:hidden;
  font-family: "Cormorant Garamond", Georgia, "Times New Roman", serif; -webkit-tap-highlight-color:transparent; }
canvas { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; }
.top { position:fixed; top:max(14px, env(safe-area-inset-top)); left:16px; right:16px; text-align:center; pointer-events:none; }
.top h1 { margin:0; font-weight:400; font-size:22px; letter-spacing:.06em; }
.top p { margin:4px 0 0; font-size:16px; color:var(--dim); font-style:italic; transition:opacity 1.2s; }
.forma { position:fixed; left:0; right:0; bottom:calc(112px + env(safe-area-inset-bottom)); text-align:center;
  font-size:19px; font-style:italic; color:var(--dim); letter-spacing:.08em; transition:opacity 1.4s; opacity:0; pointer-events:none; }
.bar { position:fixed; left:0; right:0; bottom:max(16px, env(safe-area-inset-bottom)); display:flex; justify-content:center; gap:10px; padding:0 16px; flex-wrap:wrap; }
.bar button { background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.14); color:var(--ink); border-radius:999px;
  font:inherit; font-size:16px; padding:8px 14px 8px 10px; display:flex; align-items:center; gap:8px; cursor:pointer;
  backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); transition:border-color .4s, background .4s; }
.bar button i { width:14px; height:14px; border-radius:50%; display:block; box-shadow:0 0 10px currentColor; }
.bar button.on { border-color:rgba(255,255,255,.5); background:rgba(255,255,255,.1); }
@media (max-width:480px){ .bar{gap:6px} .bar button{font-size:15px; padding:7px 11px 7px 8px} .forma{bottom:calc(120px + env(safe-area-inset-bottom))} }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="top"><h1>Дракон из света</h1><p id="hint">Выбери своего дракона</p></div>
<div class="forma" id="forma"></div>
<div class="bar" id="bar"></div>
<script>
(function () {
  'use strict';
  var cv = document.getElementById('c'), cx = cv.getContext('2d');
  var hint = document.getElementById('hint'), forma = document.getElementById('forma'), bar = document.getElementById('bar');
  var W, H, DPR, S, OX, OY;
  var small = Math.min(window.innerWidth, window.innerHeight) < 600;
  var N = small ? 2800 : 4600;
  var TAU = Math.PI * 2;
  function rnd(a, b) { return a + Math.random() * (b - a); }

  /* ---------- построитель фигур: точки {x,y,s,nx,ny,k} в единицах -1..1 ---------- */
  function Acc() { this.p = []; }
  Acc.prototype.add = function (x, y, s, nx, ny, k, w) { this.p.push({ x: x, y: y, s: s, nx: nx, ny: ny, k: k, w: w || 1 }); };
  // трубка вдоль кривой: f(t)->[x,y], wf(t)->толщина
  Acc.prototype.tube = function (f, wf, n, s0, s1, k, edge) {
    for (var i = 0; i < n; i++) {
      var t = Math.random(); var w = wf(t);
      var a = f(t), b = f(Math.min(1, t + 0.002)), c = f(Math.max(0, t - 0.002));
      var tx = b[0] - c[0], ty = b[1] - c[1], L = Math.sqrt(tx * tx + ty * ty) || 1; tx /= L; ty /= L;
      var nx = -ty, ny = tx;
      var u = Math.random() < (edge == null ? 0.4 : edge) ? (Math.random() < 0.5 ? -1 : 1) * rnd(0.82, 1) : rnd(-1, 1);
      this.add(a[0] + nx * w * u, a[1] + ny * w * u, s0 + (s1 - s0) * t, nx, ny, k == null ? t : k);
    }
  };
  Acc.prototype.line = function (f, n, s, k, w) { var a = this.p.length; this.tube(f, function () { return 0.004; }, n, s, s, k, 0); if (w) for (var i = a; i < this.p.length; i++) this.p[i].w = w; };
  Acc.prototype.dim = function (from, w) { for (var i = from; i < this.p.length; i++) this.p[i].w = w; };

  function spineTools(f) {
    return function (t) {
      var a = f(t), b = f(Math.min(1, t + 0.003)), c = f(Math.max(0, t - 0.003));
      var tx = b[0] - c[0], ty = b[1] - c[1], L = Math.sqrt(tx * tx + ty * ty) || 1;
      return { x: a[0], y: a[1], tx: tx / L, ty: ty / L, nx: -ty / L, ny: tx / L };
    };
  }

  /* дракон: spine — тело (t=0 хвост, t=1 голова), up — сторона гривы (+1/-1) */
  function dragon(o) {
    var A = new Acc(), sp = spineTools(o.spine), up = o.up, T = o.thick || 0.075;
    var wf = function (t) { return T * (0.12 + 0.88 * Math.pow(Math.sin(Math.PI * Math.min(1, t * 1.08) * 0.92 + 0.12), 0.8)) * (t > 0.93 ? 0.8 : 1); };
    A.tube(o.spine, wf, 0.5 * N, 0, 0.95, null, 0.45);
    // гребень по спине
    for (var i = 0; i < 0.07 * N; i++) {
      var t = rnd(0.05, 0.94), q = sp(t), w = wf(t), saw = Math.abs(((t * 46) % 1) - 0.5) * 2;
      var h = w * (1 + 0.9 * (1 - saw)) * Math.random();
      A.add(q.x + q.nx * up * (w + h * 0.9), q.y + q.ny * up * (w + h * 0.9), t, q.nx, q.ny, t);
    }
    // кисточка хвоста — пламя
    var q0 = sp(0);
    for (var j = 0; j < 7; j++) {
      var ang = Math.atan2(-q0.ty, -q0.tx) + (j - 3) * 0.22, len = rnd(0.12, 0.2);
      (function (ang, len) {
        A.line(function (t) { return [q0.x + Math.cos(ang + Math.sin(t * 3) * 0.3) * len * t, q0.y + Math.sin(ang + Math.sin(t * 3) * 0.3) * len * t]; }, 0.004 * N, 0, 0.05, 0.6);
      })(ang, len);
    }
    // лапы
    (o.legs || [0.3, 0.42, 0.68, 0.8]).forEach(function (lt, li) {
      var q = sp(lt), d = -up, side = li % 2 ? 1 : -1;
      var k1x = q.x + q.nx * d * 0.11 + q.tx * side * 0.03, k1y = q.y + q.ny * d * 0.11 + q.ty * side * 0.03;
      var k2x = k1x + q.tx * 0.07 + q.nx * d * 0.05, k2y = k1y + q.ty * 0.07 + q.ny * d * 0.05;
      A.line(function (t) { return [q.x + (k1x - q.x) * t, q.y + (k1y - q.y) * t]; }, 0.005 * N, lt, lt, 0.4);
      A.line(function (t) { return [k1x + (k2x - k1x) * t, k1y + (k2y - k1y) * t]; }, 0.004 * N, lt, lt, 0.4);
      for (var c = -1; c <= 1; c++) {
        var ca = Math.atan2(k2y - k1y, k2x - k1x) + c * 0.6;
        (function (ca) { A.line(function (t) { return [k2x + Math.cos(ca + t * 0.8) * 0.035 * t, k2y + Math.sin(ca + t * 0.8) * 0.035 * t]; }, 0.0018 * N, lt, lt, 0.45); })(ca);
      }
    });
    // голова
    var h = sp(1); var hx = h.x, hy = h.y;
    var HS = o.head || 1.35;
    function L(a, b) { a *= HS; b *= HS; return [hx + h.tx * a + h.nx * up * b, hy + h.ty * a + h.ny * up * b]; }
    var i2, h0 = A.p.length;
    for (i2 = 0; i2 < 0.025 * N; i2++) { var aa = rnd(0, TAU), rr = Math.random() < 0.6 ? rnd(0.85, 1) : Math.sqrt(Math.random()); var p = L(0.04 + Math.cos(aa) * 0.065 * rr, Math.sin(aa) * 0.05 * rr); A.add(p[0], p[1], 1, h.nx, h.ny, 1); }
    A.dim(h0, 0.55);
    // морда (верх) и челюсть
    A.tube(function (t) { return L(0.08 + 0.12 * t, 0.018 - 0.004 * t); }, function (t) { return 0.022 - 0.01 * t; }, 0.018 * N, 1, 1, 1, 0.6);
    A.tube(function (t) { return L(0.07 + 0.1 * t, -0.03 - 0.03 * t); }, function (t) { return 0.012 - 0.006 * t; }, 0.009 * N, 1, 1, 1, 0.6);
    A.dim(h0, 0.55); h0 = A.p.length;
    // рога
    [0.03, -0.01].forEach(function (b0, ri) {
      A.tube(function (t) { return L(0.03 - 0.17 * t, 0.045 + b0 * 0.3 + 0.13 * t + 0.04 * Math.sin(t * 3)); }, function (t) { return 0.012 * (1 - t) + 0.002; }, 0.012 * N, 1, 1, 1, 0.3);
    });
    // грива
    for (var m = 0; m < 9; m++) {
      (function (m) {
        var b0 = rnd(-0.03, 0.04), len = rnd(0.12, 0.22), ph = rnd(0, 3);
        A.line(function (t) { return L(-0.01 - len * t, b0 + 0.06 * t + 0.03 * Math.sin(t * 5 + ph)); }, 0.004 * N, 0.98, 0.98, 0.5);
      })(m);
    }
    // усы
    [1, -1].forEach(function (sd) {
      A.line(function (t) { return L(0.19 - 0.12 * t, -0.01 * sd + (-0.04 - 0.12 * t) * (sd > 0 ? 1 : 0.6) + 0.04 * Math.sin(t * 7)); }, 0.006 * N, 1, 1, 0.5);
    });
    // глаз — яркие точки
    for (var e = 0; e < 40; e++) { var ea = rnd(0, TAU), er = rnd(0, 0.009); var ep = L(0.07 + Math.cos(ea) * er, 0.022 + Math.sin(ea) * er); A.add(ep[0], ep[1], 1, 0, 0, 1, 1.6); }
    A.dim(h0, 0.5); for (var z = A.p.length - 40; z < A.p.length; z++) A.p[z].w = 1.6;
    // крылья
    if (o.wings) {
      [o.wings, o.wings + 0.06].forEach(function (wt, wi) {
        var q = sp(wt), base = Math.atan2(q.ny * up, q.nx * up), dir = -1;
        var bones = [], nb = 5;
        for (var b = 0; b < nb; b++) bones.push({ a: base + dir * (b - 1.5) * 0.3 + wi * 0.25, l: (0.7 - b * 0.08) * (wi ? 0.75 : 1) });
        bones.forEach(function (bn) { A.line(function (t) { return [q.x + Math.cos(bn.a + t * 0.25) * bn.l * t, q.y + Math.sin(bn.a + t * 0.25) * bn.l * t]; }, 0.006 * N, wt, 0.6, 0.6); });
        for (var mm = 0; mm < 0.07 * N; mm++) {
          var bi = Math.floor(rnd(0, nb - 1)), f = Math.random(), r = Math.sqrt(Math.random());
          var a1 = bones[bi].a, a2 = bones[bi + 1].a, l = bones[bi].l * (1 - f) + bones[bi + 1].l * f;
          var a = a1 * (1 - f) + a2 * f, scal = 1 - 0.25 * Math.sin(Math.PI * f);
          var rr2 = r * l * scal;
          A.add(q.x + Math.cos(a + 0.25 * r) * rr2, q.y + Math.sin(a + 0.25 * r) * rr2, wt, Math.cos(a), Math.sin(a), 0.35 + 0.5 * r, 0.5);
        }
      });
    }
    return A.p;
  }

  /* ---------- новые формы после растворения ---------- */
  function lotus() {
    var A = new Acc();
    var petals = [[-2.2, 0.55], [-1.6, 0.68], [-1.05, 0.78], [-0.5, 0.86], [0, 0.9], [0.5, 0.86], [1.05, 0.78], [1.6, 0.68], [2.2, 0.55]];
    petals.forEach(function (pp, i) {
      var a = -Math.PI / 2 + pp[0] * 0.55, l = pp[1] * 0.75;
      A.tube(function (t) { var r = l * t; return [Math.cos(a) * r, 0.25 + Math.sin(a) * r]; },
        function (t) { return 0.11 * Math.sin(Math.PI * Math.pow(t, 0.8)); }, 0.075 * N, i / 9, i / 9, 0.3 + 0.7 * Math.random(), 0.55);
    });
    A.tube(function (t) { return [-0.75 + 1.5 * t, 0.36 + 0.06 * Math.sin(t * TAU * 2)]; }, function () { return 0.02; }, 0.1 * N, 0.5, 0.5, 0.1, 0.3);
    return A.p;
  }
  function bird() {
    var A = new Acc();
    A.tube(function (t) { return [0, 0.45 - 0.75 * t]; }, function (t) { return 0.06 * Math.sin(Math.PI * Math.min(1, t * 1.1)) + 0.01; }, 0.16 * N, 0, 1, null, 0.4);
    for (var s = -1; s <= 1; s += 2) {
      for (var f = 0; f < 9; f++) {
        (function (f, s) {
          var a0 = -0.15 - f * 0.12, len = 0.85 - Math.abs(f - 3) * 0.08;
          A.tube(function (t) { var a = a0 - 0.5 * t * t; return [s * Math.cos(a) * len * t, -0.05 + Math.sin(a) * len * t * 0.9]; },
            function (t) { return 0.02 * (1 - t) + 0.006; }, 0.04 * N, 0.5, 0.5, f / 9, 0.3);
        })(f, s);
      }
    }
    for (var tl = 0; tl < 7; tl++) {
      (function (tl) { var a = Math.PI / 2 + (tl - 3) * 0.14; A.line(function (t) { return [Math.cos(a) * 0.5 * t + 0.05 * Math.sin(t * 6) * (tl - 3) / 3, 0.45 + Math.sin(a) * 0.5 * t]; }, 0.02 * N, 1, 1); })(tl);
    }
    return A.p;
  }
  function galaxy() {
    var A = new Acc();
    for (var i = 0; i < N; i++) {
      var arm = i % 3, t = Math.pow(Math.random(), 0.7), a = arm * TAU / 3 + t * 5.2, r = 0.08 + t * 0.85, sc = 0.06 * (0.3 + t);
      A.add(Math.cos(a) * r + rnd(-sc, sc), Math.sin(a) * r * 0.82 + rnd(-sc, sc), t, Math.cos(a), Math.sin(a), t);
    }
    return A.p;
  }
  function butterfly() {
    var A = new Acc();
    for (var i = 0; i < N; i++) {
      var t = rnd(0, 12 * Math.PI), r = Math.exp(Math.cos(t)) - 2 * Math.cos(4 * t) - Math.pow(Math.sin(t / 12), 5), k = Math.random();
      var rr = r * (Math.random() < 0.55 ? 1 : Math.sqrt(Math.random()));
      A.add(Math.sin(t) * rr * 0.2, -Math.cos(t) * rr * 0.2 + 0.05, k, Math.sin(t), -Math.cos(t), Math.abs(r) / 4.5);
    }
    return A.p;
  }

  /* ---------- драконы ---------- */
  var DRAGONS = [
    { id: 'fire', name: 'Огненный', col: ['#ff3d1f', '#ff9a2e', '#ffe07a'], shape: function () {
      return dragon({ up: -1, thick: 0.07, spine: function (t) { var a = 0.5 + t * 1.55 * TAU, r = 0.86 - 0.42 * t + 0.035 * Math.sin(t * 22); return [Math.cos(a) * r, Math.sin(a) * r * 0.9]; } }); } },
    { id: 'water', name: 'Водный', col: ['#0a5cff', '#22c4ff', '#c7f6ff'], shape: function () {
      return dragon({ up: 1, thick: 0.068, legs: [0.28, 0.38, 0.62, 0.72], spine: function (t) { return [-0.98 + 1.78 * t, 0.06 + 0.32 * Math.sin(TAU * 1.3 * t + 0.6) * (0.55 + 0.45 * t) - 0.1 * t]; } }); } },
    { id: 'air', name: 'Небесный', col: ['#8a7dff', '#d9d4ff', '#ffffff'], shape: function () {
      return dragon({ up: -1, thick: 0.062, wings: 0.62, legs: [0.35, 0.45, 0.7, 0.78], spine: function (t) { return [-0.85 + 1.45 * t + 0.12 * Math.sin(t * 3 * Math.PI), 0.72 - 1.2 * t + 0.1 * Math.sin(t * 2 * Math.PI)]; } }); } },
    { id: 'earth', name: 'Лесной', col: ['#1f8a3a', '#7fd65a', '#f2e98a'], shape: function () {
      return dragon({ up: -1, thick: 0.085, legs: [0.25, 0.33, 0.6, 0.68], spine: function (t) { var a = -Math.PI * 0.4 + t * 1.78 * Math.PI * 1.08, r = 0.62 + 0.06 * Math.sin(t * 9); return [Math.cos(a) * r, Math.sin(a) * r * 0.82 + 0.05]; } }); } }
  ];
  var FORMS = [
    { name: 'лотос', f: lotus }, { name: 'птица', f: bird }, { name: 'спираль', f: galaxy }, { name: 'бабочка', f: butterfly }
  ];

  /* ---------- частицы ---------- */
  var P = [];
  for (var i = 0; i < N; i++) P.push({ x: rnd(-1.6, 1.6), y: rnd(-1.6, 1.6), vx: 0, vy: 0, t: null, d: 0, a: 0, ta: 1, sz: rnd(0.6, 1.5), col: 0, ph: rnd(0, TAU) });

  var spr = [];
  function hex(c) { return [parseInt(c.substr(1, 2), 16), parseInt(c.substr(3, 2), 16), parseInt(c.substr(5, 2), 16)]; }
  function makeSprites(cols) {
    spr = [];
    var a = hex(cols[0]), b = hex(cols[1]), c = hex(cols[2]);
    for (var i = 0; i < 12; i++) {
      var f = i / 11, m = f < 0.5 ? mix(a, b, f * 2) : mix(b, c, (f - 0.5) * 2);
      var s = document.createElement('canvas'); s.width = s.height = 32; var g = s.getContext('2d');
      var gr = g.createRadialGradient(16, 16, 0, 16, 16, 16);
      gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.18, 'rgba(' + m + ',1)'); gr.addColorStop(0.45, 'rgba(' + m + ',.28)'); gr.addColorStop(1, 'rgba(' + m + ',0)');
      g.fillStyle = gr; g.fillRect(0, 0, 32, 32); spr.push(s);
    }
    function mix(p, q, f) { return [Math.round(p[0] + (q[0] - p[0]) * f), Math.round(p[1] + (q[1] - p[1]) * f), Math.round(p[2] + (q[2] - p[2]) * f)].join(','); }
  }

  var cur = null, mode = 'void', modeT = 0, now = 0, formI = 0, nextShape = null, holdSince = 0, autoNext = 14;
  function assign(pts, byS) {
    // перемешать точки, раздать частицам; задержка сборки — от центра наружу
    for (var i = pts.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), tmp = pts[i]; pts[i] = pts[j]; pts[j] = tmp; }
    for (var k = 0; k < P.length; k++) {
      var q = pts[k % pts.length], p = P[k];
      p.t = q; p.col = Math.min(11, Math.max(0, Math.round(q.k * 11)));
      var dist = Math.sqrt(q.x * q.x + q.y * q.y);
      p.d = byS ? (1 - q.s) * 1.6 + rnd(0, 0.5) : dist * 1.4 + rnd(0, 0.5);
      p.ta = 0.55 + 0.45 * Math.random();
      if (q.w) p.ta *= q.w;
    }
  }
  function gather(pts, label, byS) {
    assign(pts, byS); mode = 'gather'; modeT = now;
    forma.style.opacity = 0; if (label) setTimeout(function () { forma.textContent = label; forma.style.opacity = 1; }, 1800);
  }
  function scatter(then) {
    mode = 'scatter'; modeT = now; nextShape = then; forma.style.opacity = 0;
    for (var k = 0; k < P.length; k++) { var p = P[k]; p.d = p.t ? p.t.s * 1.4 + rnd(0, 0.4) : 0; }
  }
  function choose(dg) {
    cur = dg; makeSprites(dg.col);
    [].forEach.call(bar.children, function (b) { b.className = b.getAttribute('data-id') === dg.id ? 'on' : ''; });
    hint.textContent = 'Коснись света в центре — и дракон отпустит форму';
    var go = function () { gather(dg.shape(), dg.name + ' дракон', true); };
    if (mode === 'void' && !P[0].t) go(); else scatter(go);
    holdSince = now;
  }
  function release() {
    if (!cur || mode === 'scatter') return;
    var fm = FORMS[formI++ % FORMS.length];
    var back = (formI % 2 === 0);
    scatter(function () {
      if (back) gather(cur.shape(), cur.name + ' дракон', true);
      else gather(fm.f(), fm.name, false);
    });
    holdSince = now;
  }

  DRAGONS.forEach(function (d) {
    var b = document.createElement('button'); b.setAttribute('data-id', d.id);
    b.innerHTML = '<i style="background:' + d.col[1] + ';color:' + d.col[1] + '"></i>' + d.name;
    b.onclick = function () { choose(d); }; bar.appendChild(b);
  });

  function resize() {
    DPR = Math.min(2, window.devicePixelRatio || 1); W = window.innerWidth; H = window.innerHeight;
    cv.width = W * DPR; cv.height = H * DPR;
    S = Math.min(W, H - 150) * 0.44; OX = W / 2; OY = H / 2 - 10;
  }
  window.addEventListener('resize', resize); resize();

  cv.addEventListener('pointerdown', function (e) {
    var dx = e.clientX - OX, dy = e.clientY - OY;
    if (Math.sqrt(dx * dx + dy * dy) < Math.max(60, S * 0.3)) release();
  });

  makeSprites(['#c9a24a', '#f2d79a', '#ffffff']);
  var last = 0;
  function frame(ms) {
    var t = ms / 1000, dt = Math.min(0.05, t - (last || t)); last = t; now = t;
    var el = now - modeT;
    if (mode === 'scatter' && el > 3.2) { mode = 'void'; modeT = now; }
    if (mode === 'void' && nextShape && now - modeT > 0.6) { var f = nextShape; nextShape = null; f(); }
    if (mode === 'gather' && el > 4.5) { mode = 'form'; }
    if (mode === 'form' && cur && now - holdSince > autoNext) release();

    cx.setTransform(DPR, 0, 0, DPR, 0, 0);
    cx.globalCompositeOperation = 'source-over';
    cx.fillStyle = '#05060c'; cx.fillRect(0, 0, W, H);
    cx.globalCompositeOperation = 'lighter';

    // сердце / жемчужина в центре — остаётся всегда
    var br = 0.5 + 0.5 * Math.sin(now * TAU / 10 * 1); // дыхание ~10 с
    var cr = S * (0.09 + 0.03 * br) * (mode === 'void' || mode === 'scatter' ? 1.35 : 1);
    var g = cx.createRadialGradient(OX, OY, 0, OX, OY, cr * 3);
    var mc = hex(cur ? cur.col[2] : '#f2d79a').join(',');
    g.addColorStop(0, 'rgba(255,255,255,.95)'); g.addColorStop(0.12, 'rgba(' + mc + ',.7)'); g.addColorStop(0.4, 'rgba(' + mc + ',.12)'); g.addColorStop(1, 'rgba(' + mc + ',0)');
    cx.fillStyle = g; cx.beginPath(); cx.arc(OX, OY, cr * 3, 0, TAU); cx.fill();

    var k, p, sp, wave;
    for (k = 0; k < P.length; k++) {
      p = P[k];
      var active = p.t && (mode === 'gather' || mode === 'form') && (mode === 'form' || el > p.d);
      var dissolving = mode === 'scatter' && el > p.d;
      if (active) {
        wave = Math.sin(now * 1.4 - p.t.s * 14) * 0.012;
        var tx = p.t.x + p.t.nx * wave, ty = p.t.y + p.t.ny * wave + Math.sin(now * 0.5) * 0.01;
        p.vx += (tx - p.x) * 3.2 * dt * 60 * 0.016; p.vy += (ty - p.y) * 3.2 * dt * 60 * 0.016;
        p.vx *= 0.86; p.vy *= 0.86;
        p.a += (p.ta - p.a) * 0.04;
      } else if (dissolving || mode === 'void' || !p.t) {
        if (dissolving && !p.free) { p.free = 1; var ang = Math.atan2(p.y, p.x); p.vx += Math.cos(ang) * rnd(0.002, 0.012) + rnd(-0.004, 0.004); p.vy += Math.sin(ang) * rnd(0.002, 0.012) - rnd(0, 0.008); }
        // тихий дрейф: пыль медленно кружит вокруг сердца
        var ang2 = Math.atan2(p.y, p.x) + Math.PI / 2;
        p.vx += Math.cos(ang2) * 0.00012 + Math.sin(now * 0.7 + p.ph) * 0.00012;
        p.vy += Math.sin(ang2) * 0.00012 - 0.00006;
        p.vx *= 0.985; p.vy *= 0.985;
        p.a += ((p.t ? 0.12 : 0.2) - p.a) * 0.02;
      }
      if (mode === 'gather') p.free = 0;
      p.x += p.vx; p.y += p.vy;
      var tw = 0.75 + 0.25 * Math.sin(now * 3 + p.ph);
      var sz = (p.t ? p.sz : 0.8) * (small ? 5.5 : 6.5) * (dissolving || mode === 'void' ? 0.7 : 1);
      cx.globalAlpha = Math.max(0, Math.min(1, p.a * tw));
      cx.drawImage(spr[p.col] || spr[0], OX + p.x * S - sz / 2, OY + p.y * S - sz / 2, sz, sz);
    }
    cx.globalAlpha = 1;
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  setTimeout(function () { if (!cur) choose(DRAGONS[0]); }, 2200);
})();
</script>
