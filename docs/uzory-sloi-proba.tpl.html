<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Сад на слоях</title>
<style>/*FONTS*/
/*CSS*/
/* окошко «Проба» — только в пробе, на сайте его нет */
.pr-btn { position: fixed; z-index: 400; right: max(16px, env(safe-area-inset-right, 0px)); top: calc(52px + env(safe-area-inset-top, 0px));
  font: 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #fff4e2; background: rgba(16, 18, 40, .6); border: 1px solid rgba(255, 230, 190, .5); border-radius: 999px; padding: 7px 12px; cursor: pointer; }
.pr-box { position: fixed; z-index: 400; right: max(16px, env(safe-area-inset-right, 0px)); top: calc(90px + env(safe-area-inset-top, 0px)); width: min(320px, calc(100vw - 32px)); box-sizing: border-box;
  max-height: calc(100vh - 110px); overflow-y: auto; background: rgba(16, 18, 40, .88); color: #e8e6f4; border: 1px solid rgba(232, 230, 244, .25); border-radius: 16px; padding: 12px 14px;
  font: 13px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
.pr-box[hidden] { display: none; }
.pr-box h4 { margin: 10px 0 6px; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: rgba(232, 230, 244, .7); font-weight: 600; }
.pr-box h4:first-child { margin-top: 0; }
.pr-seg { display: flex; gap: 6px; flex-wrap: wrap; }
.pr-seg button { flex: 1 1 auto; font: inherit; color: inherit; background: rgba(255, 255, 255, .06); border: 1px solid rgba(232, 230, 244, .25); border-radius: 10px; padding: 7px 8px; cursor: pointer; }
.pr-seg button.on { background: rgba(233, 184, 114, .25); border-color: rgba(233, 184, 114, .8); color: #fff6e8; }
.pr-box label { display: block; margin-top: 6px; }
.pr-box input[type=range] { width: 100%; }
.pr-note { margin: 8px 0 0; color: rgba(232, 230, 244, .7); font-size: 12px; }
</style>
<script>
(function () {
  var IMG = { les: '/*IMG_LES*/', pg: '/*IMG_PG*/' };   // 23.10: старые фоны (А, мох, роса) из пробы убраны — проба легче; картинки в docs/uzory-sloi/
  var D = /*DATA*/;
  var q = {}; location.hash.replace(/^#/, '').split('&').forEach(function (p) { var a = p.split('='); if (a[0]) q[a[0]] = decodeURIComponent(a[1] || ''); });
  if (q.scene && q.scene !== 'pg') delete q.scene;
  var scene = q.scene || 'les', it = D.uzory.items.filter(function (x) { return x.id === 'cvetok'; })[0], sp = it.space;
  if (q.view) sp.view = q.view;
  // 22.10 (3): её первые цветы-картинки (разрезаны из «Изысканного букета» + отдельная ромашка), остальные пока рисунком
  // 22.10 (4): её слово — показываем отдельную ромашку (из букета — в запасе, docs/uzory-sloi/cvety/romashka-buket.webp)
  var CV = /*CVETY*/;
  // 23.10: её бутоны (подсолнух, ромашка, мак); стебли дорисованы (docs/uzory-stebel.py) — картинка выше на 40 %, «Рост цветка» 140 %
  var LONG = q.stem !== '0';
  if (q.cvety !== '0') it.flowers.forEach(function (f) {
    var dl = LONG && CV[f.id + '-dlinnee'];
    if (CV[f.id]) { f.image = dl || CV[f.id]; f.view = 'live'; if (dl) f.tall = 140; }
    if (q.buds !== '0' && CV['buton-' + f.id]) f.bud = dl && CV['buton-' + f.id + '-dlinnee'] || CV['buton-' + f.id];
  });
  sp.size = +q.size || 130;
  // 22.10 (4): хоровод сам не кружится (её «хоровод мешает»); бабочек можно трогать
  sp.speed = q.spin === '1' ? 'norm' : 'off';
  // 22.10: остров убран (её слово — «летящий, парящий — не нравится»); фон — её поляна со мхом, росы чуть меньше
  // 22.10 (5): её фоны по промпту «А» (обычный рост, небо и горизонт) — хоровод ниже, на ближнем мху
  // 22.10 (6): её слово — на фонах «А» цветы «как на дороге», поляна была лучше → склейка «поляна + горизонт» (docs/uzory-sloi-skleika.py)
  // 22.10 (7): её новая поляна с лесом (цельный кадр, без склейки); хоровод шире, лучи мягкие
  var img = IMG[scene] || IMG.moh, A = scene === 'a1' || scene === 'a2', PG = scene === 'pg', LES = scene === 'les';
  sp.ringW = +q.ring || 125; sp.windFrom = q.wind === 'west' ? 'west' : 'east'; sp.rays = q.rays === 'off' ? 'off' : 'soft';
  sp.layers = { on: true, time: q.time || 'day', tilt: LES ? 29 : A || PG ? 55 : 50, back: { image: img, fx: 50, fy: LES ? 65 : PG ? 74 : A ? 84 : scene === 'rosa' ? 52 : 50, zoom: LES ? 14 : A || PG ? 35 : 10, depth: .4, glints: q.glints !== '0' } };
  window.M13_UZ_DATA = D; window.PR = { q: q, scene: scene, L: sp.layers, sp: sp };
})();
</script>
</head>
<body class="uz-body">
<div id="uz" data-base="../../" data-view="garden" data-id="cvetok"></div>
<button class="pr-btn" id="prBtn" type="button">⚙ Проба</button>
<div class="pr-box" id="prBox" hidden></div>
<script>/*JS*/</script>
<script>
(function () {
  var P = window.PR, L = P.L, box = document.getElementById('prBox');
  document.getElementById('prBtn').onclick = function () { box.hidden = !box.hidden; };
  function go(k, v) { P.q[k] = v; location.hash = Object.keys(P.q).map(function (x) { return x + '=' + encodeURIComponent(P.q[x]); }).join('&'); location.reload(); }
  function seg(title, key, cur, opts, live) {
    return '<h4>' + title + '</h4><div class="pr-seg" data-key="' + key + '"' + (live ? ' data-live="1"' : '') + '>' + opts.map(function (o) {
      return '<button type="button" data-v="' + o[0] + '"' + (o[0] === cur ? ' class="on"' : '') + '>' + o[1] + '</button>'; }).join('') + '</div>';
  }
  function rng(label, id, min, max, val) { return '<label>' + label + ' <b id="' + id + 'V">' + val + '</b><input type="range" id="' + id + '" min="' + min + '" max="' + max + '" value="' + val + '"></label>'; }
  var g = L.ground, b = L.back;
  box.innerHTML =
    '<h4>Бутоны (все 12 — её картинки)</h4><div class="pr-seg" id="prBuds"><button type="button" data-b="1">Весь сад в бутонах</button><button type="button" data-b="0" class="on">Цветы</button></div>' +
    seg('Стебли', 'stem', P.q.stem === '0' ? '0' : '1', [['1', 'Длиннее (дорисованы)'], ['0', 'Как на картинке']]) +
    seg('Ветер дует', 'wind', P.sp.windFrom, [['east', 'С востока (справа налево)'], ['west', 'С запада (слева направо)']]) +
    seg('Фон', 'scene', P.scene, [['les', 'Поляна с лесом'], ['pg', 'Поляна + горизонт']]) +
    seg('Блики росы (мерцают сами)', 'glints', P.q.glints === '0' ? '0' : '1', [['1', 'Да'], ['0', 'Нет']]) +
    seg('Время суток (4 вечера на выбор)', 'time', L.time, [['day', 'День'], ['gold', 'Золотой час'], ['blue', 'Синие сумерки'], ['rain', 'После дождя'], ['lights', 'Сумерки с огоньками'], ['night', 'Ночь'], ['evening', 'Прежний вечер']], true) +
    seg('Лучи света', 'rays', P.sp.rays, [['soft', 'Мягкие'], ['off', 'Без лучей']]) +
    seg('Хоровод сам кружится', 'spin', P.q.spin === '1' ? '1' : '0', [['0', 'Нет — цветы стоят'], ['1', 'Да']]) +
    seg('Её цветы-картинки (ромашка, мак, лаванда, пион)', 'cvety', P.q.cvety === '0' ? '0' : '1', [['1', 'Показать'], ['0', 'Все рисунком']]) +
    seg('Размер цветов', 'size', String(P.sp.size), [['100', 'Как было'], ['130', 'Крупнее'], ['160', 'Ещё крупнее']]) +
    seg('Остальные цветы (пока нет картинок)', 'view', P.sp.view || 'live', [['live', 'Рисунок'], ['line', 'Линией'], ['card', 'Стекло']]) +
    '<h4>Хоровод на земле</h4>' + rng('Ширина хоровода, %', 'ring', 80, 180, P.sp.ringW) + rng('Наклон земли', 'tilt', 25, 75, L.tilt) +
    (g ? rng('Размер земли', 'gw', 180, 460, g.w) + rng('Земля выше / ниже', 'gy', 20, 70, g.y) : '') +
    (b ? rng('Картинка: где центр холма (по высоте)', 'fy', 30, 75, b.fy) + rng('Картинка: где центр (по ширине)', 'fx', 25, 75, b.fx) + rng('Запас для сдвига', 'bz', 0, 40, b.zoom) : '') +
    '<p class="pr-note">Сад встречает бутонами (все 12 — ваши): обновите страницу, чтобы увидеть снова. Бабочки: тронь — вспорхнёт. Нажми и держи — бабочка у тебя (сияет и трепещет): веди и отпусти над цветком — сядет на него, над травой — на траву. Хоровод встаёт так, что перед светом — просвет между цветами. Покрутите хоровод пальцем — дальний план и передний сдвигаются по-разному. Настройки пробы — для того, чтобы найти, как лучше; потом они станут полями в панели.</p>';
  // бутоны: весь хоровод сразу в бутонах — посмотреть, как они стоят (на сайте бутоны — в «Наугад»)
  var bb = document.getElementById('prBuds');
  bb.onclick = function (e) {
    var v = e.target.getAttribute('data-b'); if (!v) return; e.stopPropagation();
    var ring = document.querySelector('.uz-ring'); if (ring) ring.classList.toggle('is-buds', v === '1');
    [].forEach.call(bb.children, function (c) { c.classList.toggle('on', c === e.target); });
  };
  [].forEach.call(box.querySelectorAll('.pr-seg:not(#prBuds)'), function (s) {
    s.onclick = function (e) {
      var v = e.target.getAttribute('data-v'); if (!v) return;
      if (s.getAttribute('data-live')) { L.time = v; P.q.time = v; history.replaceState(null, '', '#' + Object.keys(P.q).map(function (x) { return x + '=' + P.q[x]; }).join('&'));
        [].forEach.call(s.children, function (c) { c.classList.toggle('on', c === e.target); }); }
      else go(s.getAttribute('data-key'), v);
    };
  });
  function bind(id, fn) { var i = document.getElementById(id); if (!i) return; i.oninput = function () { document.getElementById(id + 'V').textContent = i.value; fn(+i.value); }; }
  bind('ring', function (v) { P.sp.ringW = v; P.q.ring = v; window.dispatchEvent(new Event('resize')); });
  bind('tilt', function (v) { L.tilt = v; window.dispatchEvent(new Event('resize')); });
  bind('gw', function (v) { g.w = v; }); bind('gy', function (v) { g.y = v; });
  bind('fy', function (v) { b.fy = v; }); bind('fx', function (v) { b.fx = v; }); bind('bz', function (v) { b.zoom = v || .01; });
})();
</script>
</body>
</html>
